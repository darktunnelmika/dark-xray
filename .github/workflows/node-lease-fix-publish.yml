name: Publish verified node lease fix
on:
  push:
    branches: [automation/node-lease-fix-publisher-20261001]
    paths: [.github/workflows/node-lease-fix-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify and apply exact source-only patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/node-lease-fix.patch.gz.b64 | gzip -d > /tmp/node-lease-fix.patch
          echo 'de13d35210716890aa4e1e01afc016ed2b21f0a538a7bb0c660f3878a8d3a081  /tmp/node-lease-fix.patch' | sha256sum -c -
          git checkout --detach d48b99ab75093c760e9d57aa502ef628273c943e
          git apply --index /tmp/node-lease-fix.patch
          git diff --cached --check
          printf '%s\n' VERSION backend/nodes.py docs/node-monitor-lease-stability.md tests/run-tests.sh tests/test_node_monitor_parallel.py | sort > /tmp/expected-paths
          git diff --cached --name-only | sort > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
          python tools/repo-check.py
      - name: Isolated regression suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pip install -q -r requirements-dev.txt
          python -m pytest -q tests/test_node_monitor.py tests/test_node_monitor_parallel.py tests/test_hub_lease.py tests/test_accounting_stability.py tests/test_node_agent_architecture.py tests/test_node_hub_recovery.py tests/test_node_installations.py tests/test_node_credential_concurrency.py tests/test_node_credentials.py tests/test_node_control_lifecycle.py tests/test_node_ordered_control.py tests/test_node_pairing.py tests/test_node_recovery.py tests/test_node_guard_recovery.py
      - name: Publish fix branch without publisher files
        run: |
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(nodes): isolate accounting lease monitoring and preserve fail-closed guards (rc29)'
          git push origin HEAD:refs/heads/fix/node-lease-flapping-rc29
