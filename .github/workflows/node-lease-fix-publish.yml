name: Publish verified node lease fix
on:
  push:
    branches: [automation/node-lease-fix-publisher-20261001]
    paths: [.github/workflows/node-lease-fix-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Adapt exact Stop observation to node-owned monitor workers
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach 5d79965379b00391536c2bb121f687c2412ed891
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          p=Path('tests/test_node_automatic_helpers.py')
          source=p.read_text()
          old="if threading.current_thread() is reg.thread and result.get('executed'):"
          new="if threading.current_thread().name == 'dark-node-monitor-'+node and result.get('executed'):"
          assert source.count(old)==1
          p.write_text(source.replace(old,new))
          names=sorted(p for p in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if p and p!='SHA256SUMS')
          Path('SHA256SUMS').write_text(''.join(hashlib.sha256(Path(p).read_bytes()).hexdigest()+'  '+p+'\n' for p in names))
          PY
          git add tests/test_node_automatic_helpers.py SHA256SUMS
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          sha256sum -c SHA256SUMS >/tmp/checksums.log
          diff -u <(git ls-files | grep -vx 'SHA256SUMS' | LC_ALL=C sort) <(cut -c67- SHA256SUMS | LC_ALL=C sort)
          python tools/repo-check.py
      - name: Test exact Stop receipts and unchanged fail-closed behavior
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pip install -q -r requirements-dev.txt
          python -m pytest -q tests/test_node_automatic_helpers.py tests/test_node_security_lab.py tests/test_node_monitor.py tests/test_node_monitor_parallel.py tests/test_hub_lease.py tests/test_accounting_stability.py
      - name: Publish tested QA-only followup for connector-controlled promotion
        run: |
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test(nodes): track independent monitor workers and refresh source checksums'
          git push origin HEAD:refs/heads/fix/node-lease-flapping-rc29-qa
