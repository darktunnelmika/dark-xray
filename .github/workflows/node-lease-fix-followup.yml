name: Validate lease fix harness and checksums
on:
  push:
    branches: [automation/node-lease-fix-publisher-20261001]
    paths: [.github/workflows/node-lease-fix-followup.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Adapt deterministic monitor observation and regenerate exact checksums
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach 5d79965379b00391536c2bb121f687c2412ed891
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          p=Path('tests/test_node_automatic_helpers.py')
          text=p.read_text()
          old="            if threading.current_thread() is reg.thread and result.get('executed'):"
          new="            # Delivery now runs on the per-node worker, not its supervisor.\n            if threading.current_thread().name == 'dark-node-monitor-'+node and result.get('executed'):"
          assert text.count(old)==1
          p.write_text(text.replace(old,new))
          names=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          names=sorted(n for n in names if n and n!='SHA256SUMS')
          Path('SHA256SUMS').write_text(''.join(hashlib.sha256(Path(n).read_bytes()).hexdigest()+'  '+n+'\n' for n in names))
          PY
          sha256sum -c SHA256SUMS
          diff -u <(git ls-files | grep -vx 'SHA256SUMS' | LC_ALL=C sort) <(cut -c67- SHA256SUMS | LC_ALL=C sort)
          git add tests/test_node_automatic_helpers.py SHA256SUMS
          git diff --cached --check
          printf '%s\n' SHA256SUMS tests/test_node_automatic_helpers.py | sort > /tmp/expected-paths
          git diff --cached --name-only | sort > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
      - name: Validate behavioral assertions, Restore accounting and new scheduler
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pip install -q -r requirements-dev.txt
          python -m pytest -q tests/test_node_automatic_helpers.py tests/test_node_security_lab.py tests/test_node_monitor_parallel.py tests/test_restore_safety.py tests/test_restore_safety_stability.py tests/test_meter_write_amplification.py
      - name: Publish tests and provenance only
        run: |
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test(nodes): observe per-node monitor delivery and refresh rc29 checksums'
          git push origin HEAD:refs/heads/fix/node-lease-flapping-rc29
