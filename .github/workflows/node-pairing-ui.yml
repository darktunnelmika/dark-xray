name: Node pairing UI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pairing-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pairing-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      DARK_REQUIRE_PAIR_HTTP: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Pairing protocol and full-panel HTTP browser flow
        run: |
          test -z "${DARK_BROWSER_TEST_BRIDGE:-}"
          python -m pytest tests/test_node_pairing.py tests/test_pair_loss_regression.py tests/test_node_pairing_cancellation.py tests/test_node_pairing_cancellation_guards.py tests/test_node_pairing_browser.py tests/test_node_pairing_cancellation_browser.py -q --junitxml=qa/junit/pairing-ui.xml
      - name: Upload pairing UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dark-node-pairing-ui
          path: |
            qa/junit/pairing-ui.xml
            qa/browser-pairing-*.png
          if-no-files-found: error
          retention-days: 14
