name: Add DARK active session management once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  session-management:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply patch
        run: python tools/add_session_management_once.py
      - name: Syntax smoke
        run: |
          python -m py_compile backend/auth.py backend/server.py tests/test_sessions.py
          node --check web/live.js
          python tools/repo-check.py
      - name: Install tests
        run: python -m pip install -r requirements-dev.txt
      - name: Full suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: bash tests/run-tests.sh
      - name: Publish
        run: |
          git config user.name darktunnelmika
          git config user.email mikakhadmi@gmail.com
          git add backend web tests
          git commit -m 'Add active session management'
          git push origin HEAD:main
