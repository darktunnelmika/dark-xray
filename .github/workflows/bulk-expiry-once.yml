name: Bulk expiry hardening once
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python tools/bulk_expiry_hardening_once.py
      - run: python -m py_compile backend/server.py tests/test_clients_v2.py
      - run: python -m pip install -q -r requirements-dev.txt
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest tests/test_clients_v2.py -q
      - run: |
          git config user.name darktunnelmika
          git config user.email mikakhadmi@gmail.com
          git rm .github/workflows/bulk-expiry-once.yml tools/bulk_expiry_hardening_once.py
          git add backend/server.py tests/test_clients_v2.py
          git commit -m 'Protect no-expiry clients in bulk day adjustments'
          git push origin HEAD:main
