name: Patch Settings V2 UI once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-settings-v2-ui-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Harden Settings V2 UI behavior
        run: python tools/patch_settings_v2_ui_hardening.py
      - name: Smoke UI
        run: |
          node --check web/live.js
          node --check web/settings-v2.js
          grep -q "old.access_mode==='ssh'" web/settings-v2.js
          grep -q "session_max_age_minutes" web/settings-v2.js
          grep -q "dark-reduced-motion" web/live.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/live.js web/settings-v2.js
          git commit -m 'Make Settings V2 preferences and SSH fallback effective'
          git push
