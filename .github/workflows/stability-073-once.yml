name: DARK 0.7.3 stability once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  stabilize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply stability patch
        run: python tools/stability_073_once.py
      - name: Repair regression harness and expiry floor
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/test_supervisor.py');s=p.read_text()
          old='''def test_persisted_core_counters_continue_across_owned_restart(engine):
              engine.create({'email':'test','id':'e02b3ba0-a9b8-4d0c-8bd1-93c6eae6afda','enable':True},[])
              engine.command('start')
              (engine.runtime/'stats-fixture.json').write_text('{"stat":[{"name":"user>>>test>>>traffic>>>uplink","value":"100"}]}')
              engine.collect_stats(force=True)
              assert engine.clients()[0]['traffic']['up']==100
              engine.command('restart')
              (engine.runtime/'stats-fixture.json').write_text('{"stat":[{"name":"user>>>test>>>traffic>>>uplink","value":"20"}]}')
              engine.collect_stats(force=True)
              assert engine.clients()[0]['traffic']['up']==120
          '''
          new='''def test_persisted_core_counters_continue_across_owned_restart(engine,monkeypatch):
              import subprocess
              raw={'value':100};real=subprocess.run
              def run(args,**kw):
                  if len(args)>=3 and args[1:3]==['api','statsquery']:
                      body='{"stat":[{"name":"user>>>test>>>traffic>>>uplink","value":"%s"}]}'%raw['value']
                      return subprocess.CompletedProcess(args,0,body,'')
                  return real(args,**kw)
              monkeypatch.setattr(subprocess,'run',run)
              engine.create({'email':'test','id':'e02b3ba0-a9b8-4d0c-8bd1-93c6eae6afda','enable':True},[])
              engine.command('start')
              engine.collect_stats(force=True)
              assert engine.clients()[0]['traffic']['up']==100
              engine.command('restart')
              raw['value']=20
              engine.collect_stats(force=True)
              assert engine.clients()[0]['traffic']['up']==120
          '''
          if old not in s:raise SystemExit('stats restart test anchor missing')
          p.write_text(s.replace(old,new,1))
          p=Path('backend/server.py');s=p.read_text()
          if "patch['expiryTime']=max(1,base+body.add_days*86400000)" not in s:raise SystemExit('expiry floor anchor missing')
          p.write_text(s.replace("patch['expiryTime']=max(1,base+body.add_days*86400000)","patch['expiryTime']=max(1000,base+body.add_days*86400000)",1))
          p=Path('tests/test_accounting_stability.py');s=p.read_text()
          p.write_text(s.replace("assert d['client']['expiryTime']==1","assert d['client']['expiryTime']==1000",1))
          PY
      - name: Static smoke
        run: |
          python -m py_compile backend/core.py backend/server.py tests/test_accounting_stability.py tests/test_supervisor.py
          node --check web/clients-v2.js
          node --check web/xray-v2.js
          bash -n tests/run-tests.sh
          python tools/repo-check.py
      - name: Install tests
        run: python -m pip install -r requirements-dev.txt
      - name: Full isolated suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: bash tests/run-tests.sh
      - name: Publish application changes
        run: |
          git config user.name darktunnelmika
          git config user.email mikakhadmi@gmail.com
          git add backend web tests VERSION
          git commit -m 'Harden accounting subscription and core recovery'
          git push origin HEAD:main
