name: Subscription portal acceptance
on:
  push:
    branches: [main, feature/sub-cyber-portal-stable]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: subscription-portal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install acceptance dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Backend browser and native-client contract
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          mkdir -p qa/junit
          python -m pytest tests/test_subscription_portal.py -q --junitxml=qa/junit/subscription-portal.xml
      - name: Launcher and local-artwork contract
        run: node --test tests/subscription-portal.test.cjs
      - name: Responsive browser acceptance
        run: python tests/subscription-portal-browser.py
      - name: Candidate source guard
        run: |
          python -m py_compile backend/server.py tests/test_subscription_portal.py tests/subscription-portal-browser.py
          node --check web/sub-portal.js
          node --check web/sub-icons.js
          ! grep -E 'mzstatic|is[0-9]-ssl' web/sub-portal.html web/sub-portal.css web/sub-portal.js
          grep -q "native_clients=.*v2box.*happ" backend/server.py
          printf 'SUBSCRIPTION_PORTAL_ACCEPTANCE=PASS\n'
      - name: Upload portal QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dark-xray-subscription-portal-qa
          path: |
            qa/junit/subscription-portal.xml
            qa/subscription-portal-browser.json
            qa/subscription-portal-android.png
            qa/subscription-portal-ios.png
            qa/subscription-portal-windows.png
          if-no-files-found: error
          retention-days: 14
