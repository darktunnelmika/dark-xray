name: RC2 legacy safe-update compatibility once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == 'darktunnelmika'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Install focused test dependency
        run: python -m pip install -q pytest
      - name: Apply RC2 compatibility hotfix
        run: |
          python tools/rc2_update_compat_once.py
          python -m py_compile tools/update.py tests/test_update_transaction.py
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q tests/test_update_transaction.py
          python tools/repo-check.py
          grep -qx '0.9.0-rc2' VERSION
          grep -q 'legacy-compat' tools/update.py
          grep -q 'test_legacy_doctor_without_panel_route_uses_strict_compat_probe' tests/test_update_transaction.py
      - name: Publish hotfix and self-clean
        run: |
          git config user.name darktunnelmika
          git config user.email mikakhadmi@gmail.com
          git rm .github/workflows/rc2-update-compat-once.yml tools/rc2_update_compat_once.py
          git add tools/update.py tests/test_update_transaction.py VERSION README.md README.en.md README.fa.md STATUS.fa.md TESTING-RC.fa.md PUBLISH-STATUS.json CHANGELOG.fa.md
          git commit -m 'Prepare DARK XRAY v0.9.0-rc2 safe-update hotfix'
          git push origin HEAD:main
