name: Node automatic policy and outage acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: node-automatic-limits-${{ github.ref }}
  cancel-in-progress: true
jobs:
  automatic-node-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      DARK_REAL_XRAY_BINARY: ${{ github.workspace }}/.test-core/xray
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify namespace and real HTTP lifecycle harness
        run: python -m pytest tests/test_node_automatic_helpers.py tests/test_node_security_lab.py -q --junitxml=qa/junit/node-automatic-helpers.xml
      - name: Fetch and verify pinned official Xray
        run: python tools/fetch-core.py --version v26.3.27 --destination "$GITHUB_WORKSPACE/.test-core"
      - name: Automatic policy through real Hub HTTP and Agent HTTPS
        run: |
          mkdir -p qa/node-automatic-limits
          export DARK_SECURITY_PARENT_NETNS="$(readlink /proc/self/ns/net)"
          sudo --preserve-env=DARK_REAL_XRAY_BINARY,DARK_SECURITY_PARENT_NETNS,PYTEST_DISABLE_PLUGIN_AUTOLOAD \
            unshare --net -- "$(command -v python)" tests/node_automatic_lab.py
      - name: Preserve exact source and core provenance
        if: always()
        run: |
          mkdir -p qa/node-automatic-limits
          git rev-parse HEAD > qa/node-automatic-limits/source-commit.txt
          sha256sum tests/test_node_automatic_limits.py tests/test_node_automatic_helpers.py tests/node_automatic_lab.py tests/node_security_lab.py tests/test_node_real_data_plane.py tests/test_node_real_limits.py tests/test_node_real_security.py tests/test_node_wan_https.py .github/workflows/node-automatic-limits.yml docs/node-automatic-limits.md > qa/node-automatic-limits/source-sha256.txt
          if test -f .test-core/DARK-CORE-PROVENANCE.json; then
            cp .test-core/DARK-CORE-PROVENANCE.json qa/node-automatic-limits/core-provenance.json
          fi
      - name: Upload bounded evidence without temporary credentials
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dark-node-automatic-limits
          path: |
            qa/junit/node-automatic-limits.xml
            qa/junit/node-automatic-helpers.xml
            qa/node-automatic-limits/
            tests/test_node_automatic_limits.py
            tests/test_node_automatic_helpers.py
            tests/node_automatic_lab.py
            docs/node-automatic-limits.md
          if-no-files-found: error
          retention-days: 14
