name: Node replacement UI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: node-replacement-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  replacement-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Owner operation discovery and real HTTP browser flow
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pytest tests/test_node_replacement_current.py -q --junitxml=qa/junit/replacement-current.xml
          python -m pytest tests/test_node_replacement_ui.py -q --junitxml=qa/junit/replacement-browser.xml
      - name: Upload replacement UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dark-node-replacement-ui
          path: |
            qa/junit/replacement-*.xml
            qa/browser-replacement-*.png
          if-no-files-found: error
          retention-days: 14
