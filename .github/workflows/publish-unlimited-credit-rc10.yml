name: Publish verified unlimited-credit source
on:
  push:
    branches: [automation/publish-unlimited-credit-rc10]
    paths: [.github/workflows/publish-unlimited-credit-rc10.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'darktunnelmika/dark-xray'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/unlimited-user-month-credit
          fetch-depth: 0
          persist-credentials: true
      - name: Publish exact tested dependency fix and refreshed checksums
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '38053801e7c34775c5fe81b8ffc3b58a497fa6f3'
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 60 \
            'https://steven.darkvpn.info:2087/assets/source-transfer-node-credit-closeout.bundle' -o /tmp/credit-final.bundle
          echo '0f144f90216ce4ccf027098c298bd621dba15e6ce2d7b647c1c216e820be847a  /tmp/credit-final.bundle' | sha256sum --check
          git bundle verify /tmp/credit-final.bundle
          git fetch /tmp/credit-final.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = '93739a6ebe74eb9818b40c8287cb83d23378c5be'
          test "$(git rev-parse FETCH_HEAD^{tree})" = 'af60ffdd93735e3f66436617674e10bf25c399e6'
          git checkout --detach FETCH_HEAD
          sha256sum -c SHA256SUMS
          python3 tools/repo-check.py
          git push origin HEAD:refs/heads/fix/unlimited-user-month-credit
