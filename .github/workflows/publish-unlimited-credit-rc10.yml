name: Publish verified unlimited-credit source
on:
  push:
    branches: [automation/publish-unlimited-credit-rc10]
    paths: [qa/unlimited-credit.bundle.b64]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'darktunnelmika/dark-xray'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Validate exact reviewed commit and publish feature branch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode qa/unlimited-credit.bundle.b64 > /tmp/unlimited-credit.bundle
          echo 'ee8aac1360220c73bbbe6bd7e8de8788a9f18a5db0cfd6132dc290e4d51de31e  /tmp/unlimited-credit.bundle' | sha256sum --check
          git bundle verify /tmp/unlimited-credit.bundle
          git fetch /tmp/unlimited-credit.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = '15173f9b854b73108be0093ab7c4e64d155e32fd'
          test "$(git rev-parse FETCH_HEAD^{tree})" = 'eacc2decc13844b53bdda30c27ca182cbc4e4284'
          git push origin FETCH_HEAD:refs/heads/fix/unlimited-user-month-credit
