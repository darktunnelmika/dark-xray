name: Publish verified unlimited-credit source
on:
  push:
    branches: [automation/publish-unlimited-credit-rc10]
    paths: [.github/workflows/publish-unlimited-credit-rc10.yml]
permissions:
  contents: write
jobs:
  checksums:
    if: github.repository == 'darktunnelmika/dark-xray'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/unlimited-user-month-credit
          fetch-depth: 0
          persist-credentials: true
      - name: Refresh checksums without modifying reviewed runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '4e2b9c40b0733ce5cbc26c97e8e6129dd773ca0b'
          python3 tools/release_snapshot.py --refresh-source-sums
          test "$(git diff --name-only)" = 'SHA256SUMS'
          sha256sum -c SHA256SUMS
          diff -u <(git ls-files | grep -vx 'SHA256SUMS' | LC_ALL=C sort) <(cut -c67- SHA256SUMS | LC_ALL=C sort)
          git add SHA256SUMS
          git -c user.name='DARK XRAY Automation' -c user.email='automation@users.noreply.github.com' commit -m 'chore: refresh rc10 exact source checksum manifest'
          git push origin HEAD:refs/heads/fix/unlimited-user-month-credit
