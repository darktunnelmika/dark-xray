name: Restore TLS frontend
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated dependencies
        run: python -m pip install -r requirements.txt pytest==9.0.2
      - name: Original ports, TLS status and HEAD isolation
        env:
          PYTHONPATH: backend
        run: python -m pytest -q tests/test_restore_frontend.py tests/test_dark_restore.py tests/test_restore_groups.py tests/test_restore_node_observer.py
      - name: CLI syntax and dispatch
        run: |
          bash -n darkxray
          python -m py_compile tools/restore_tls.py backend/restore_frontend.py
          python tools/restore_tls.py --help
