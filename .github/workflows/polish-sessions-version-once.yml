name: Polish DARK sessions and version once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply polish
        run: python tools/polish_sessions_version_once.py
      - name: Syntax smoke
        run: |
          python -m py_compile backend/server.py tests/test_standalone.py
          node --check web/i18n-en.js
          grep -q '0.7.1-standalone-lab' VERSION
          python tools/repo-check.py
      - name: Install tests
        run: python -m pip install -r requirements-dev.txt
      - name: Full suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: bash tests/run-tests.sh
      - name: Publish application polish
        run: |
          git checkout -- .github/workflows/ci.yml
          git config user.name darktunnelmika
          git config user.email mikakhadmi@gmail.com
          git add VERSION backend web tests
          git commit -m 'Polish active sessions and version reporting'
          git push origin HEAD:main
