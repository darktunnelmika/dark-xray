name: Link delivery center acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: link-delivery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Delivery source and unit contract
        run: |
          node --check web/clients-v4.js
          node --test tests/clients-v4.test.cjs
          python -m py_compile tests/link-delivery-browser.py
      - name: Real Chromium QR delivery acceptance
        run: python tests/link-delivery-browser.py
      - name: Candidate guard
        run: |
          grep -q "svg.setAttribute('width','240')" web/clients-v4.js
          grep -q 'id="cv4d-selected-payload"' web/clients-v4.js
          grep -q 'cv4ddownloadpng' web/clients-v4.js
          grep -q 'Clients V6 — cyber link delivery center' web/clients-v4.css
          printf 'LINK_DELIVERY_CENTER_ACCEPTANCE=PASS\n'
      - name: Upload link center evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dark-xray-link-delivery-qa
          path: |
            qa/link-delivery-center.json
            qa/link-delivery-center-desktop.png
            qa/link-delivery-center-mobile.png
          if-no-files-found: error
          retention-days: 14
