name: Restore safety and real limits
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: restore-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  restore-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: backend
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      DARK_REAL_XRAY_BINARY: ${{ github.workspace }}/.test-core/xray
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source checksums and coverage
        run: |
          sha256sum -c SHA256SUMS
          diff -u <(git ls-files | grep -vx 'SHA256SUMS' | LC_ALL=C sort) <(cut -c67- SHA256SUMS | LC_ALL=C sort)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install isolated dependencies
        run: python -m pip install -r requirements-dev.txt playwright
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Strict source metadata and policy isolation
        run: python -m pytest tests/test_restore_safety.py tests/test_restore_safety_stability.py tests/test_restore_groups.py tests/test_restore_targets.py tests/test_restore_frontend.py tests/test_meter_write_amplification.py -q --junitxml=qa/junit/restore-safety.xml
      - name: Frontend permissions and exact numeric inputs
        run: node --test tests/restore-safety.test.cjs tests/restore-targets.test.cjs tests/restore-view-sync.test.cjs
      - name: Confirmed review and suspension through real owner login
        run: python tests/restore-safety-browser.py
      - name: Fetch verified official Xray
        run: python tools/fetch-core.py --version v26.3.27 --destination "$GITHUB_WORKSPACE/.test-core"
      - name: Pre-delivered Direct and Tunnel quota and natural expiry
        run: python -m pytest tests/test_restore_real_limits.py -q --junitxml=qa/junit/restore-real-limits.xml
      - name: Upload isolated evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: restore-safety-evidence
          path: |
            qa/junit/restore-safety.xml
            qa/junit/restore-real-limits.xml
            qa/restore-safety-browser*
            qa/node-real-data-plane/
          retention-days: 14
          if-no-files-found: warn
