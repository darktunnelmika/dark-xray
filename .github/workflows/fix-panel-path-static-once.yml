name: Fix panel path static routing once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-panel-path-static-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Fix prefix rewrite for mounted static assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/server.py');s=p.read_text()
          old="            request.scope['root_path']=panel_path\n            request.scope['path']=raw_path[len(panel_path):] or '/'"
          new="            # Rewrite only the routing path. Setting root_path here makes Starlette\n            # StaticFiles apply the prefix a second time and turns valid prefixed\n            # assets into 404 responses. Browser/API URL generation is handled by\n            # the explicit panel base in the frontend.\n            request.scope['path']=raw_path[len(panel_path):] or '/'"
          if old not in s: raise SystemExit('panel prefix rewrite anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          python -m py_compile backend/server.py
      - name: Install focused test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run URI path regression test
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest tests/test_settings_v2.py::test_panel_uri_path_scopes_ui_api_and_cookie -q
      - name: Commit routing fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/server.py
          git commit -m 'Fix static assets under panel URI path'
          git push
