name: DARK 0.7.4 recovery once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply recovery patch
        run: python tools/recovery_074_once.py
      - name: Static smoke
        run: |
          python -m py_compile backend/core.py backend/manager.py tests/test_destructive_recovery.py
          bash -n tests/run-tests.sh
          python tools/repo-check.py
      - name: Install tests
        run: python -m pip install -r requirements-dev.txt
      - name: Full isolated suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: bash tests/run-tests.sh
      - name: Publish application changes
        run: |
          git config user.name darktunnelmika
          git config user.email mikakhadmi@gmail.com
          git add backend tests VERSION
          git commit -m 'Make destructive client recovery crash-safe'
          git push origin HEAD:main
