name: Inbounds V3 save hotfix once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == 'darktunnelmika'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Apply precise hotfix
        run: |
          python tools/inbounds_v3_xhttp_once.py
          node --check web/inbounds-v3.js
          grep -Fq "if(network==='xhttp'){st.xhttpSettings=" web/inbounds-v3.js
          grep -Fq "catch(ex){toast(ex?.message" web/inbounds-v3.js
      - name: Publish hotfix and self-clean
        run: |
          git config user.name darktunnelmika
          git config user.email mikakhadmi@gmail.com
          git rm .github/workflows/inbounds-v3-xhttp-once.yml tools/inbounds_v3_xhttp_once.py
          git add web/inbounds-v3.js
          git commit -m 'Fix Inbounds V3 non-XHTTP save crash'
          git push origin HEAD:main
