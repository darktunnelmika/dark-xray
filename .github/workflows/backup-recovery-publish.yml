name: Verify and publish Backup Recovery candidate
on:
  push:
    branches: [automation/backup-recovery-publisher-20261002]
    paths: [.github/workflows/backup-recovery-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reconstruct and verify exact audited source
        shell: bash
        run: |
          set -euo pipefail
          cp qa/backup-recovery-capsule.b64 /tmp/recovery-source.b64
          git checkout --detach 37a86982bd599eda52bb866b354d4c569d4229e3
          python - <<'PY'
          import base64,hashlib,json,lzma,subprocess
          from pathlib import Path
          raw=base64.b64decode(Path('/tmp/recovery-source.b64').read_text().strip(),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='c58034c792e5f9c1abe308111ecc72a366cb156bd46593f25413c50c422c894f'
          doc=json.loads(lzma.decompress(raw))
          assert doc['base']==subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()
          allowed={'VERSION','backend/backup.py','tools/backup_cli.py','web/ops-v2.js','web/overview-v4.js','tests/run-tests.sh','tests/browser-smoke.py','tests/test_backup_recovery_closeout.py','tests/backup-recovery-ui.test.cjs','tests/backup-recovery-browser.py','docs/BACKUP-RECOVERY-CLOSEOUT.md'}
          assert set(doc['files'])==allowed
          for name,spec in doc['files'].items():
              path=Path(name)
              if spec['before'] is None:
                  assert not path.exists()
                  old=''
              else:
                  old=path.read_text()
                  assert hashlib.sha256(old.encode()).hexdigest()==spec['before'],name
              for start,end,text in reversed(spec['edits']):
                  assert 0<=start<=end<=len(old)
                  old=old[:start]+text+old[end:]
              assert hashlib.sha256(old.encode()).hexdigest()==spec['after'],name
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(old)
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          names=sorted(x for x in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if x and x!='SHA256SUMS')
          Path('SHA256SUMS').write_text(''.join(hashlib.sha256(Path(x).read_bytes()).hexdigest()+'  '+x+'\n' for x in names))
          subprocess.run(['git','add','SHA256SUMS'],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines())==allowed|{'SHA256SUMS'}
          PY
          sha256sum -c SHA256SUMS >/dev/null
          diff -u <(git ls-files | grep -vx SHA256SUMS | LC_ALL=C sort) <(cut -c67- SHA256SUMS | LC_ALL=C sort)
          git diff --cached --check
      - name: Run isolated backup and UI regressions
        run: |
          python -m pip install -r requirements-dev.txt
          PYTHONPATH=backend python -m pytest -q tests/test_backup_recovery_closeout.py tests/test_backup_hardening.py tests/test_backup_cli.py
          node --test tests/*.test.cjs
          python tools/repo-check.py
      - name: Publish candidate branch only; no merge or deployment
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code origin refs/heads/hardening/backup-recovery-closeout; then
            echo 'Candidate branch already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(backup): truthful isolated recovery readiness and accessible encrypted backups'
          git push origin HEAD:refs/heads/hardening/backup-recovery-closeout
