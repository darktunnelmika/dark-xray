name: DARK 0.7.5 policy once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply policy patch
        run: python tools/policy_075_once.py
      - name: Fix generated SQL quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/manager.py');s=p.read_text()
          bad="rows=self.store.db.execute('SELECT m.inbounds,c.limit_ip,c.id FROM managed_clients m JOIN clients c ON c.id=m.email WHERE c.owner=? AND m.state!='deleted'',(owner,)).fetchall()"
          good='rows=self.store.db.execute("SELECT m.inbounds,c.limit_ip,c.id FROM managed_clients m JOIN clients c ON c.id=m.email WHERE c.owner=? AND m.state!=\'deleted\'",(owner,)).fetchall()'
          if bad not in s:raise SystemExit('generated SQL quote anchor missing')
          p.write_text(s.replace(bad,good,1))
          PY
      - name: Static smoke
        run: |
          python -m py_compile backend/core.py backend/manager.py tests/test_policy_consistency.py
          node --check web/live.js
          bash -n tests/run-tests.sh
          python tools/repo-check.py
      - name: Install tests
        run: python -m pip install -r requirements-dev.txt
      - name: Full isolated suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: bash tests/run-tests.sh
      - name: Publish application changes
        run: |
          git config user.name darktunnelmika
          git config user.email mikakhadmi@gmail.com
          git add backend web tests VERSION
          git commit -m 'Enforce customer inbound and owner policy consistency'
          git push origin HEAD:main
