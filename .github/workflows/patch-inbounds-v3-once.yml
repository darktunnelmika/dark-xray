name: Patch Inbounds V3 once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-inbounds-v3-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - name: Harden V3 UX
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('web/inbounds-v3.js')
          s=p.read_text()

          old="""function syncForm(form){const net=form.elements.network?.value||'tcp',sec=form.elements.security?.value||'none',proto=form.elements.protocol?.value||'vless';form.querySelectorAll('[data-v3-net]').forEach(x=>x.hidden=x.dataset.v3Net!==net);form.querySelectorAll('[data-v3-security]').forEach(x=>x.hidden=x.dataset.v3Security!==sec);form.querySelectorAll('[data-v3-proto]').forEach(x=>x.hidden=x.dataset.v3Proto!==proto);const ok=supportFallback(proto,net,sec),note=form.querySelector('[data-v3-fallback-note]');if(note)note.innerHTML=ok?`<div class=\"iv3-notice ok\">${L('Fallbacks are available for this combination.','Fallback برای این ترکیب فعال است.')}</div>`:`<div class=\"iv3-notice\">${L('Fallbacks require VLESS/Trojan + TCP + TLS/REALITY. Existing JSON is preserved but not edited here.','Fallback نیازمند VLESS/Trojan + TCP + TLS/REALITY است؛ JSON موجود حفظ می‌شود.')}</div>`;form.querySelector('[data-v3-action=fallback-add]')?.toggleAttribute('disabled',!ok);}"""
          new="""function syncForm(form){let net=form.elements.network?.value||'tcp',sec=form.elements.security?.value||'none',proto=form.elements.protocol?.value||'vless';const realityOK=['vless','trojan'].includes(proto)&&['tcp','grpc','xhttp'].includes(net),secureOK=net!=='kcp';const realityBtn=form.querySelector('[data-v3-action=segment][data-name=security][data-value=reality]'),tlsBtn=form.querySelector('[data-v3-action=segment][data-name=security][data-value=tls]');if(realityBtn)realityBtn.disabled=!realityOK;if(tlsBtn)tlsBtn.disabled=!secureOK;if((sec==='reality'&&!realityOK)||((sec==='tls'||sec==='reality')&&!secureOK)){sec='none';if(form.elements.security)form.elements.security.value='none';form.querySelectorAll('[data-v3-action=segment][data-name=security]').forEach(x=>x.classList.toggle('active',x.dataset.value==='none'));}form.querySelectorAll('[data-v3-net]').forEach(x=>x.hidden=x.dataset.v3Net!==net);form.querySelectorAll('[data-v3-security]').forEach(x=>x.hidden=x.dataset.v3Security!==sec);form.querySelectorAll('[data-v3-proto]').forEach(x=>x.hidden=x.dataset.v3Proto!==proto);const ok=supportFallback(proto,net,sec),note=form.querySelector('[data-v3-fallback-note]');if(note)note.innerHTML=ok?`<div class=\"iv3-notice ok\">${L('Fallbacks are available for this combination.','Fallback برای این ترکیب فعال است.')}</div>`:`<div class=\"iv3-notice\">${L('Fallbacks require VLESS/Trojan + TCP + TLS/REALITY.','Fallback نیازمند VLESS/Trojan + TCP + TLS/REALITY است.')}</div>`;form.querySelector('[data-v3-action=fallback-add]')?.toggleAttribute('disabled',!ok);}"""
          assert old in s
          s=s.replace(old,new,1)

          old=""" if(protocol==='vless')settings.decryption=settings.decryption||'none';if(protocol==='shadowsocks')settings.method=fd.get('ssmethod')||'aes-128-gcm';const fallbacks=fallbackValues(form);if(fallbacks.length)settings.fallbacks=fallbacks;else delete settings.fallbacks;\n sn.enabled="""
          new=""" if(protocol==='vless')settings.decryption=settings.decryption||'none';if(protocol==='shadowsocks')settings.method=fd.get('ssmethod')||'aes-128-gcm';const fallbacks=fallbackValues(form);if(supportFallback(protocol,network,security)&&fallbacks.length)settings.fallbacks=fallbacks;else delete settings.fallbacks;if(security==='tls'&&(!String(fd.get('cert')||'').trim()||!String(fd.get('key')||'').trim()))throw Error(L('TLS requires both certificate and private key files.','TLS به مسیر گواهی و کلید خصوصی نیاز دارد.'));\n sn.enabled="""
          assert old in s
          s=s.replace(old,new,1)

          old="""function useTarget(form,index){const r=ui.targetResults[Number(index)];if(!r)return;form.elements.realityTarget.value=r.target||'';const sni=(r.serverNames||[])[0]||r.host||'';if(sni)form.elements.realitySni.value=sni;form.querySelector('[data-v3-target-result]').innerHTML=renderProbe(r);}"""
          new="""function useTarget(form,index){const r=ui.targetResults[Number(index)];if(!r)return;form.elements.realityTarget.value=r.target||'';const names=(r.serverNames||[]).filter(x=>x&&!String(x).startsWith('*.')),sni=names.includes(r.host)?r.host:(names[0]||r.host||'');if(sni)form.elements.realitySni.value=sni;form.querySelector('[data-v3-target-result]').innerHTML=renderProbe(r);}"""
          assert old in s
          s=s.replace(old,new,1)

          old="""document.addEventListener('input',ev=>{if(ev.target.id==='iv3-search'){ui.query=ev.target.value;renderPage();}});"""
          new="""let iv3SearchTimer;document.addEventListener('input',ev=>{if(ev.target.id==='iv3-search'){ui.query=ev.target.value;const pos=ev.target.selectionStart;clearTimeout(iv3SearchTimer);iv3SearchTimer=setTimeout(async()=>{await renderPage();const input=document.querySelector('#iv3-search');if(input){input.focus();try{input.setSelectionRange(pos,pos);}catch{}}},120);}});"""
          assert old in s
          s=s.replace(old,new,1)

          old="""return `<div class=\"iv3-probe ok\">${ico('activity')}<div><b>${esc(r.latencyMs)} ms · ${esc(r.tlsVersion||'TLS')} · ${esc(r.alpn||'no ALPN')}</b><small>${esc(r.ip||'')} · ${r.certValid?L('certificate valid','گواهی معتبر'):L('certificate not verified','گواهی تأیید نشد')}</small></div>${r.recommended?pill(L('Recommended','پیشنهادی'),'ok'):''}</div>`;"""
          new="""return `<div class=\"iv3-probe ok\">${ico('activity')}<div><b>${esc(r.latencyMs)} ms · ${esc(r.tlsVersion||'TLS')} · ${esc(r.alpn||'no ALPN')}</b><small>${L('VPS TCP/TLS handshake','هندشیک TCP/TLS از VPS')} · ${esc(r.ip||'')} · ${r.certValid?L('certificate valid','گواهی معتبر'):L('certificate not verified','گواهی تأیید نشد')}</small></div>${r.recommended?pill(L('Recommended','پیشنهادی'),'ok'):''}</div>`;"""
          assert old in s
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
          node --check web/inbounds-v3.js
          grep -q "realityBtn.disabled" web/inbounds-v3.js
          grep -q "VPS TCP/TLS handshake" web/inbounds-v3.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/inbounds-v3.js
          git commit -m 'Harden Inbounds V3 compatibility and target UX'
          git push
