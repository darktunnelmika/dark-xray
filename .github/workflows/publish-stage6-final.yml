name: Publish Stage 6 Rollback Fix Release

on:
  push:
    branches:
      - automation/publish-d4f263-stage6-final

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      TARGET_BRANCH: work/stage6-global-enforcement
      PATCH_BASE: http://82.47.63.242:18123
      RELEASE_TAG: v0.9.0-rc7-stage6-rollbackfix
      RELEASE_TITLE: DARK XRAY 0.9.0-rc7 Stage 6 Rollback Fix
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Apply rollback fix patch
        run: |
          set -euo pipefail
          mkdir -p tools tests qa
          curl -fsS "$PATCH_BASE/tools/update.py" -o tools/update.py
          curl -fsS "$PATCH_BASE/tests/test_update_transaction.py" -o tests/test_update_transaction.py
          curl -fsS "$PATCH_BASE/qa/public-release-update-rollback-fix-d4f263.json" -o qa/public-release-update-rollback-fix-d4f263.json
          curl -fsS "$PATCH_BASE/SHA256SUMS" -o SHA256SUMS
          python3 -m py_compile tools/update.py
          python3 tools/repo-check.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/update.py tests/test_update_transaction.py qa/public-release-update-rollback-fix-d4f263.json SHA256SUMS
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix rollback reactivation for public release updates"
            git push origin HEAD:$TARGET_BRANCH
          fi
          echo "PUBLISHED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PUBLISHED_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Build release artifact
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/dark-xray-release"
          rm -rf "$DIST"
          mkdir -p "$DIST"
          python3 tools/release_snapshot.py \
            --commit "$PUBLISHED_COMMIT" \
            --accepted-runtime-commit "$PUBLISHED_COMMIT" \
            --accepted-runtime-stage public-release-rollbackfix \
            --output "$DIST" \
            --json-only
          (cd "$DIST" && sha256sum -c SHA256SUMS.release)
          python3 - <<'PY'
          import json, os, pathlib
          dist = pathlib.Path(os.environ['RUNNER_TEMP']) / 'dark-xray-release'
          p = next(dist.glob('*.manifest.json'))
          doc = json.loads(p.read_text())
          assert doc['release_commit'] == os.environ['PUBLISHED_COMMIT']
          assert doc['release_tree'] == os.environ['PUBLISHED_TREE']
          assert doc['accepted_runtime_stage'] == 'public-release-rollbackfix'
          print(json.dumps({
              'manifest': str(p),
              'release_commit': doc['release_commit'],
              'release_tree': doc['release_tree'],
              'accepted_runtime_stage': doc['accepted_runtime_stage'],
              'artifacts': doc['artifacts'],
          }, indent=2, sort_keys=True))
          PY
          echo "DIST=$DIST" >> "$GITHUB_ENV"

      - name: Prepare release notes
        run: |
          set -euo pipefail
          MANIFEST=$(ls "$DIST"/*.manifest.json)
          cat > RELEASE_NOTES.md <<MD
          ## DARK XRAY 0.9.0-rc7 Stage 6 Rollback Fix

          This prerelease patch fixes and validates public-release update rollback reactivation.

          Target commit:
          \`$PUBLISHED_COMMIT\`

          Release tree:
          \`$PUBLISHED_TREE\`

          ### Included artifacts

          - \`$(basename "$DIST"/dark-xray-*.tar.gz)\`
          - \`$(basename "$DIST"/dark-xray-*.zip)\`
          - \`$(basename "$MANIFEST")\`
          - \`SHA256SUMS.release\`

          ### Acceptance status

          Passed before publishing:

          - rollback reactivation unit coverage
          - release snapshot tests
          - repository checks
          - patched public-release rollback injection in clean systemd-nspawn container

          ### Artifact checksums

          \`\`\`text
          $(cat "$DIST/SHA256SUMS.release")
          \`\`\`

          ### Scope note

          This is still a prerelease. It fixes public update rollback reactivation and does not claim provider SLA sizing or production CA renewal.
          MD

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            "$DIST"/dark-xray-*.tar.gz
            "$DIST"/dark-xray-*.zip
            "$DIST"/dark-xray-*.manifest.json
            "$DIST"/SHA256SUMS.release
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --target "$PUBLISHED_COMMIT" --title "$RELEASE_TITLE" --notes-file RELEASE_NOTES.md --prerelease
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$PUBLISHED_COMMIT" \
              --title "$RELEASE_TITLE" \
              --notes-file RELEASE_NOTES.md \
              --prerelease
          fi
          gh release view "$RELEASE_TAG" --json tagName,targetCommitish,url,isPrerelease
