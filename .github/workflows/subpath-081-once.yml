name: DARK 0.8.1 subscription path once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  subscription-path:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Align patch anchor with current core
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/subpath_081_once.py');s=p.read_text()
          old="""            if type(value['enabled']) is not bool or type(value['auto_detect']) is not bool:raise CoreError('Invalid subscription toggles')
                      if value['default_format'] not in ('raw','base64','json','clash'):raise CoreError('Unsupported default subscription format')"""
          new="""            if type(value['enabled']) is not bool or type(value['auto_detect']) is not bool or value['default_format'] not in ('raw','base64','json','clash'):raise CoreError('Invalid subscription mode')"""
          if old not in s:raise SystemExit('subscription validation helper anchor missing')
          p.write_text(s.replace(old,new))
          PY
      - name: Apply subscription path patch
        run: python tools/subpath_081_once.py
      - name: Static smoke
        run: |
          python -m py_compile backend/core.py backend/manager.py backend/server.py tests/test_subscription_path.py
          node --check web/settings-v2.js
          bash -n tests/run-tests.sh
          python tools/repo-check.py
      - name: Install tests
        run: python -m pip install -r requirements-dev.txt
      - name: Full isolated suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: bash tests/run-tests.sh
      - name: Publish application changes
        run: |
          git config user.name darktunnelmika
          git config user.email mikakhadmi@gmail.com
          git add backend web tests VERSION
          git commit -m 'Add configurable subscription URI path'
          git push origin HEAD:main
