name: Stabilize DARK runtime once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Apply stabilization patch
        run: python tools/stabilize_runtime_once.py

      - name: Syntax and installer smoke
        run: |
          python -m py_compile backend/core.py backend/server.py backend/owner_recovery.py tools/menu.py tools/settings_apply.py tools/runtime_stage.py tools/provision.py tools/doctor.py
          bash -n install-online.sh setup.sh darkxray
          bash install-online.sh --selftest > /tmp/dark-installer-smoke.txt
          grep -q 'Installer runtime self-test passed' /tmp/dark-installer-smoke.txt
          node --check web/settings-v2.js

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run isolated suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: bash tests/run-tests.sh

      - name: Publish application stabilization
        run: |
          git checkout -- .github/workflows/ci.yml
          git config user.name darktunnelmika
          git config user.email mikakhadmi@gmail.com
          git add backend tools install-online.sh web tests
          git reset tools/stabilize_runtime_once.py
          git commit -m 'Harden owner recovery and panel URI path'
          git push origin HEAD:main
