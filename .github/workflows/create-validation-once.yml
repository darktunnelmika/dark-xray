name: Create validation order fix once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == 'darktunnelmika'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install focused dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply and test validation order fix
        run: |
          python tools/create_validation_once.py
          python -m py_compile backend/manager.py
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest tests/test_reset_scheduler_v2.py tests/test_bulk_batching.py tests/test_clients_v2.py -q
      - name: Publish patch and self-clean
        run: |
          git config user.name darktunnelmika
          git config user.email mikakhadmi@gmail.com
          git rm .github/workflows/create-validation-once.yml tools/create_validation_once.py
          git add backend/manager.py
          git commit -m 'Preserve client validation order after batching'
          git push origin HEAD:main
