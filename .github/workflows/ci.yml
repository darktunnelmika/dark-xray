name: Source checks and isolated tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Repository hygiene
        run: python tools/repo-check.py
      - name: Installer runtime and manager smoke
        run: |
          bash -n install-online.sh setup.sh darkxray
          bash install-online.sh --selftest > /tmp/dark-installer-smoke.txt
          grep -q '\[100/100\]' /tmp/dark-installer-smoke.txt
          grep -q 'Installer runtime self-test passed' /tmp/dark-installer-smoke.txt
          python -m py_compile tools/menu.py tools/update.py tools/provision.py tools/settings_apply.py backend/server.py backend/auth.py backend/policy_auth.py backend/core.py backend/reality_scan.py
          printf '0\n' | NO_COLOR=1 python tools/menu.py > /tmp/dark-menu-smoke.txt
          grep -q 'MAIN MENU' /tmp/dark-menu-smoke.txt
          grep -q 'settings-apply' darkxray
      - name: Cyber UI, Inbounds V3, Settings V2 and English-default smoke
        run: |
          node --check web/i18n-en.js
          node --check web/inbounds-models.js
          node --check web/inbounds-v3.js
          node --check web/settings-v2.js
          grep -q '<html lang="en" dir="ltr">' web/index.html
          grep -q '/assets/cyber.css' web/index.html
          grep -q '/assets/i18n-en.js' web/index.html
          grep -q '/assets/inbounds-v3.css' web/index.html
          grep -q '/assets/inbounds-models.js' web/index.html
          grep -q '/assets/inbounds-v3.js' web/index.html
          grep -q '/assets/settings-v2.css' web/index.html
          grep -q '/assets/settings-v2.js' web/index.html
          ! grep -q '/assets/runtime-policy.js' web/index.html
          ! grep -q '/assets/inbounds-v2.js' web/index.html
          grep -q "target-search" web/inbounds-v3.js
          grep -q "realIpPreset" web/inbounds-v3.js
          grep -q "maxTimeDiff" web/inbounds-v3.js
          grep -q "@app.post('/api/reality/scan')" backend/server.py
          grep -q "/api/runtime-config" backend/server.py
          grep -q "panelMeta must be an object" backend/core.py
          grep -q "session_seconds" backend/auth.py
          grep -q 'PASSWORD_MIN_LENGTH=8' backend/policy_auth.py
          grep -q 'PASSWORD_MIN_LENGTH=8' backend/server.py
          grep -q 'PASSWORD_MIN_LENGTH=8' tools/provision.py
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Isolated test suite (test-double Xray; simulated firewall)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: bash tests/run-tests.sh
