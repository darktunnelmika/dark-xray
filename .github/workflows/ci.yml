name: Source checks and isolated tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Repository hygiene
        run: python tools/repo-check.py
      - name: Installer updater and manager smoke
        run: |
          bash -n install-online.sh install-node.sh setup.sh darkxray tests/systemd-recovery-smoke.sh
          bash install-online.sh --selftest > /tmp/dark-installer-smoke.txt
          grep -q '\[100/100\]' /tmp/dark-installer-smoke.txt
          grep -q 'Installer runtime self-test passed' /tmp/dark-installer-smoke.txt
          grep -q 'DARK_XRAY_REF' install-online.sh
          grep -q 'restoring previous DARK XRAY source' tools/update.py
          grep -q 'backend/owner_recovery.py' darkxray
          grep -q 'account)' darkxray
          grep -q 'tools/check.py' darkxray
          grep -q 'vps-verify)' darkxray
          grep -q 'production-gate)' darkxray
          grep -q 'target-vps-gate)' darkxray
          grep -q 'load-gate)' darkxray
          grep -q 'node-wan-gate)' darkxray
          grep -q 'tools/production-gate.py' darkxray
          grep -q 'stage-runtime|stage-panel-path)' darkxray
          grep -q 'reset-password|account|stage-runtime|stage-panel-path' tools/update.py
          grep -q 'reset-password|account|stage-runtime|stage-panel-path' tools/provision.py
          python -m py_compile \
            tools/menu.py tools/update.py tools/provision.py tools/provision_node.py tools/update_node.py tools/settings_apply.py tools/runtime_stage.py tools/doctor.py tools/check.py tools/vps-verify.py tools/node-wan-gate.py tools/production-gate.py tools/target-vps-gate.py tools/load-scale-gate.py tools/smoke-real.py \
            tests/browser-smoke.py tests/test_production_gate.py tests/kernel-firewall-smoke.py tests/load-scale-smoke.py tests/test_node_agent_architecture.py tests/test_node_hub_recovery.py tests/verify-node-install.py \
            backend/server.py backend/auth.py backend/policy_auth.py backend/core.py backend/node_agent.py backend/node_runtime.py backend/node_updated.py \
            backend/manager.py backend/reality_scan.py backend/nodes.py backend/owner_recovery.py
          grep -q "report={'version':VERSION" tools/smoke-real.py
          grep -q 'DARK-XRAY-REAL-E2E-{VERSION}' tools/smoke-real.py
          ! grep -q "'version':'0.6.0'" tools/smoke-real.py
          grep -q "installed_customer_database_modified':False" tools/production-gate.py
          grep -q "installed_firewall_modified':False" tools/production-gate.py
          grep -q 'test_production_gate.py' tests/run-tests.sh
          printf '0\n' | NO_COLOR=1 python tools/menu.py > /tmp/dark-menu-smoke.txt
          grep -q 'D A R K   V P N' /tmp/dark-menu-smoke.txt
          grep -q 'MAIN CONTROL MATRIX' /tmp/dark-menu-smoke.txt
          grep -q 'Account & Access' /tmp/dark-menu-smoke.txt
          grep -q 'Update & Repair' /tmp/dark-menu-smoke.txt
          grep -q 'settings-apply' darkxray
          grep -q 'Change panel URI path' tools/menu.py
          grep -q 'Generate random panel URI path' tools/menu.py
          grep -q 'Create primary owner login' tools/menu.py
          grep -q 'panel_route' tools/doctor.py
          grep -q "'changes_made':False" tools/vps-verify.py
      - name: Full cyber workspace smoke
        run: |
          for js in \
            web/i18n-en.js web/form-models.js web/inbounds-models.js web/inbounds-v3.js \
            web/settings-v2.js web/clients-v2.js web/finance-v2.js web/ui-stability.js web/xray-v2.js web/hosts-v2.js \
            web/ops-v2.js web/nodes-v2.js web/overview-v4.js web/xray-guided-v3.js web/traffic-engine-v4.js; do node --check "$js"; done
          grep -q '<html lang="en" dir="ltr">' web/index.html
          grep -q 'body class="skin-cyber-classic"' web/index.html
          grep -q 'assets/cyber-classic.css' web/index.html
          grep -q -- '--classic-green:#19ff86' web/cyber-classic.css
          for asset in \
            cyber.css cyber-classic.css inbounds-v3.css settings-v2.css clients-v2.css finance-v2.css xray-v2.css xray-guided-v3.css hosts-v2.css ops-v2.css nodes-v2.css overview-v4.css \
            i18n-en.js inbounds-models.js inbounds-v3.js settings-v2.js clients-v2.js finance-v2.js ui-stability.js xray-v2.js xray-guided-v3.js hosts-v2.js ops-v2.js nodes-v2.js overview-v4.js; do
            grep -q "assets/$asset" web/index.html
          done
          ! grep -q '/assets/runtime-policy.js' web/index.html
          ! grep -q '/assets/inbounds-v2.js' web/index.html
          grep -q 'PANEL_BASE' web/live.js
          grep -q 'aria-busy' web/ui-stability.js
          ! grep -q 'assets/rbac-v2.js' web/index.html
          ! grep -q "data-page=\\\"roles\\\"" web/live.js
          grep -q '/api/resellers' backend/server.py
          grep -q '/api/resellers/' web/live.js
          grep -q 'max_client_hwid' backend/manager.py
          grep -q 'DarkXrayGuidedV3' web/xray-guided-v3.js
          grep -q 'assets/xray-guided-v3.js' web/index.html
          grep -q 'assets/xray-guided-v3.css' web/index.html
          grep -q 'ov4-resource-grid' web/overview-v4.js
          grep -q 'connections' backend/core.py
          grep -q 'panel' backend/core.py
          grep -q 'observed_at' web/finance-v2.js
          grep -q 'Panel URI path' web/settings-v2.js
          grep -q 'Generate random path' web/settings-v2.js
          grep -q 'panel_path' backend/core.py
          grep -q 'panel_path' backend/server.py
          grep -q 'target-search' web/inbounds-v3.js
          grep -q 'realIpPreset' web/inbounds-v3.js
          grep -q 'maxTimeDiff' web/inbounds-v3.js
          grep -q '/api/clients/bulk-create' backend/server.py
          grep -q '/api/groups' backend/server.py
          grep -q "default_format.*clash" backend/core.py
          grep -q 'application/yaml' backend/core.py
          grep -q '/api/logs/{kind}' backend/server.py
          grep -q '/api/backup/status' backend/server.py
          grep -q '/node/api/health' backend/server.py
          grep -q '/api/nodes' backend/server.py
          grep -q '/api/runtime-config' backend/server.py
          grep -q 'panelMeta must be an object' backend/core.py
          grep -q 'session_seconds' backend/auth.py
          grep -q 'ROLE_ALLOWED' backend/auth.py
          ! grep -q 'ip.read' backend/auth.py
          grep -q 'test_sync_redaction.py' tests/run-tests.sh
          grep -q 'PASSWORD_MIN_LENGTH=8' backend/policy_auth.py
          grep -q 'PASSWORD_MIN_LENGTH=8' backend/server.py
          grep -q 'PASSWORD_MIN_LENGTH=8' tools/provision.py
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Isolated test suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: bash tests/run-tests.sh
      - name: Hub backup and Agent API recovery integration
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest tests/test_node_hub_recovery.py -q --junitxml=qa/junit/node-hub-recovery.xml
      - name: Upload recovery integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dark-node-hub-recovery-${{ matrix.python }}
          path: qa/junit/node-hub-recovery.xml
          if-no-files-found: warn
          retention-days: 14

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Strict browser QA
        run: python tests/browser-smoke.py
      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dark-xray-browser-qa
          path: |
            qa/browser-results.json
            qa/browser-*.png
          if-no-files-found: error
          retention-days: 14

  real-core:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch verified official Xray
        run: |
          mkdir -p qa
          python tools/fetch-core.py --version v26.3.27 --destination /tmp/dark-xray-real-core
          cp /tmp/dark-xray-real-core/DARK-CORE-PROVENANCE.json qa/real-core-provenance.json
      - name: Real Xray data-plane smoke
        run: python tools/smoke-real.py --binary /tmp/dark-xray-real-core/xray --report qa/real-core.json
      - name: Upload real-core evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dark-xray-real-core-qa
          path: |
            qa/real-core.json
            qa/real-core-provenance.json
          if-no-files-found: error
          retention-days: 14

  kernel-firewall:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install kernel test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -q nftables iproute2 >/dev/null
      - name: Real nftables packet smoke
        run: sudo -E python tests/kernel-firewall-smoke.py --report qa/kernel-firewall.json
      - name: Upload kernel firewall evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dark-xray-kernel-firewall-qa
          path: qa/kernel-firewall.json
          if-no-files-found: error
          retention-days: 14

  systemd-recovery:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install host prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y -q python3-venv ca-certificates >/dev/null
      - name: Real systemd crash recovery smoke
        run: sudo bash tests/systemd-recovery-smoke.sh
      - name: Upload systemd recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dark-xray-systemd-recovery-qa
          path: qa/systemd-recovery.json
          if-no-files-found: error
          retention-days: 14

  load-scale:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install load dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: 1000-client load and SQLite contention smoke
        run: python tests/load-scale-smoke.py --clients 1000 --concurrency 12 --report qa/load-scale.json
      - name: Upload load/scale evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dark-xray-load-scale-qa
          path: qa/load-scale.json
          if-no-files-found: error
          retention-days: 14

  fresh-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install fresh-install driver
        run: sudo apt-get update -qq && sudo apt-get install -y -q expect >/dev/null
      - name: Fresh online install on disposable Ubuntu
        env:
          DARK_INSTALL_REF: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          mkdir -p qa
          export DARK_CI_PASSWORD="DkCi-${GITHUB_RUN_ID}-Aa!9"
          echo "::add-mask::$DARK_CI_PASSWORD"
          cat > /tmp/dark-fresh-install.exp <<'EOF'
          set timeout 1200
          set ref $env(DARK_INSTALL_REF)
          set pass $env(DARK_CI_PASSWORD)
          log_file -noappend qa/fresh-install.log
          spawn sudo env DARK_XRAY_REF=$ref NO_COLOR=1 bash ./install-online.sh
          expect {
            -re {Choose profile \[1\]: $} { send "2\r"; exp_continue }
            -re {Owner username \[dark\]: $} { send "darkci\r"; exp_continue }
            -re {Panel URI path \[/\]: $} { send "/ci\r"; exp_continue }
            -re {Panel port \[2087\]: $} { send "2087\r"; exp_continue }
            -re {Public proxy IP/DNS \[[^]]+\]: $} { send "127.0.0.1\r"; exp_continue }
            -re {Start installation\? \[Y/n\]: $} { send "y\r"; exp_continue }
            -re {DARK owner password \([0-9]+-[0-9]+ characters\): $} { send "$pass\r"; exp_continue }
            -re {Repeat owner password: $} { send "$pass\r"; exp_continue }
            -re {Enable BBR congestion control\? \[Y/n\]: $} { send "n\r"; exp_continue }
            timeout { exit 124 }
            eof
          }
          catch wait result
          exit [lindex $result 3]
          EOF
          expect /tmp/dark-fresh-install.exp
      - name: Verify installed services and production gate
        env:
          DARK_INSTALL_REF: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          set -euo pipefail
          systemctl is-enabled dark-xray.service
          systemctl is-active dark-xray.service
          systemctl is-enabled dark-xray-update.service
          systemctl is-active dark-xray-update.service
          sudo darkxray check
          sudo python3 -c 'import json,sys; from pathlib import Path; expected=sys.argv[1].lower(); doc=json.loads(Path("/var/lib/dark-xray/installed-source.json").read_text()); assert doc.get("commit","").lower()==expected,(doc,expected); assert doc.get("version")' "$DARK_INSTALL_REF"
          sudo darkxray vps-verify | tee qa/fresh-install-vps-verify.txt
          sudo darkxray production-gate --json-only | tee qa/fresh-install-production-gate.json
      - name: Capture fresh-install diagnostics on failure
        if: failure()
        run: |
          systemctl status dark-xray.service dark-xray-update.service --no-pager -l > qa/fresh-install-systemd.txt 2>&1 || true
          journalctl -u dark-xray.service -u dark-xray-update.service --no-pager -n 250 > qa/fresh-install-journal.txt 2>&1 || true
      - name: Upload fresh-install evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dark-xray-fresh-install-qa
          path: |
            qa/fresh-install.log
            qa/fresh-install-vps-verify.txt
            qa/fresh-install-production-gate.json
            qa/fresh-install-systemd.txt
            qa/fresh-install-journal.txt
          if-no-files-found: warn
          retention-days: 14

  fresh-node-agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Install Node host prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y -q python3-venv ca-certificates nftables openssl curl >/dev/null
      - name: Create isolated Node TLS fixture
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/dark-node-key.pem -out /tmp/dark-node-cert.pem -days 1 \
            -subj '/CN=node.example.test' \
            -addext 'subjectAltName=DNS:node.example.test' >/dev/null 2>&1
      - name: Provision real lightweight Node Agent
        run: |
          mkdir -p qa
          if ! sudo python3 tools/provision_node.py \
            --domain node.example.test \
            --port 9443 \
            --data-address node.example.test \
            --name CI-NODE \
            --node-id ci-node-001 \
            --ssh-port 22 \
            --core-version v26.3.27 \
            --source-commit "$(git rev-parse HEAD)" \
            --source-ref ci-fresh-node \
            --cert /tmp/dark-node-cert.pem \
            --key /tmp/dark-node-key.pem > /tmp/fresh-node-agent-install.log 2>&1; then
              cat /tmp/fresh-node-agent-install.log
              exit 1
          fi
          sudo python3 - <<'PY' > qa/fresh-node-agent-install.json
          import json
          from pathlib import Path
          pair=json.loads(Path('/var/lib/dark-xray-node/pair.json').read_text())
          source=json.loads(Path('/var/lib/dark-xray-node/installed-source.json').read_text())
          print(json.dumps({
              'installed':True,'agent_only':True,'node_id':pair['nodeId'],
              'origin':pair['origin'],'pair_code_present':pair['pairCode'].startswith('DXN1.'),
              'source':{k:source.get(k) for k in ('commit','version','ref','role')}
          },indent=2))
          PY
      - name: Verify agent-only filesystem and services
        run: |
          set -euo pipefail
          sudo python3 tests/verify-node-install.py --phase filesystem --expected-commit "$(git rev-parse HEAD)" | tee qa/fresh-node-agent-filesystem.json
      - name: Verify authenticated Node HTTPS health
        run: |
          set -euo pipefail
          sudo python3 tests/verify-node-install.py --phase health --expected-commit "$(git rev-parse HEAD)" --ca /tmp/dark-node-cert.pem | tee qa/fresh-node-agent-health.json
      - name: Capture Node diagnostics on failure
        if: failure()
        run: |
          systemctl status dark-xray-node.service dark-xray-node-guard.service dark-xray-node-update.service --no-pager -l > qa/fresh-node-agent-systemd.txt 2>&1 || true
          journalctl -u dark-xray-node.service -u dark-xray-node-guard.service -u dark-xray-node-update.service --no-pager -n 300 > qa/fresh-node-agent-journal.txt 2>&1 || true
      - name: Upload Node Agent evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dark-xray-fresh-node-agent-qa
          path: |
            qa/fresh-node-agent-install.json
            qa/fresh-node-agent-filesystem.json
            qa/fresh-node-agent-health.json
            qa/fresh-node-agent-systemd.txt
            qa/fresh-node-agent-journal.txt
          if-no-files-found: warn
          retention-days: 14
