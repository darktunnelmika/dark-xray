name: Owner login selector UX once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == 'darktunnelmika'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Install focused test dependency
        run: python -m pip install -q pytest
      - name: Apply owner selector UX patch
        run: |
          python tools/account_owner_selector_once.py
          python -m py_compile tools/menu.py tests/test_menu_owner_selection.py
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q tests/test_menu_owner_selection.py
          python tools/repo-check.py
          grep -q "Select login Owner" tools/menu.py
          grep -q "Profiles without login/password" tools/menu.py
      - name: Publish patch and self-clean
        run: |
          git config user.name darktunnelmika
          git config user.email mikakhadmi@gmail.com
          git rm .github/workflows/account-owner-selector-once.yml tools/account_owner_selector_once.py
          git add tools/menu.py tests/test_menu_owner_selection.py tests/run-tests.sh
          git commit -m 'List login owners before account recovery actions'
          git push origin HEAD:main
