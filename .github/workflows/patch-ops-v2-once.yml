name: Patch Operations V2 once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-ops-v2-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Apply Operations V2 backend migration
        run: python tools/patch_ops_v2_once.py
      - name: Smoke Operations V2
        run: |
          python -m py_compile backend/server.py
          node --check web/ops-v2.js
          bash -n tests/run-tests.sh
          grep -q '/api/logs/{kind}' backend/server.py
          grep -q '/api/backup/status' backend/server.py
          grep -q '/assets/ops-v2.js' web/index.html
      - name: Commit application code
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/server.py tests/run-tests.sh tests/test_ops_v2.py
          git commit -m 'Wire Operations V2 logs and backup status backend'
          git push
