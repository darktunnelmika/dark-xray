name: Apply Inbounds V3 core wiring once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-reality-routes-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - name: Patch core and slim inbound list
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          core=Path('backend/core.py')
          s=core.read_text()
          old="allowed={'remark','protocol','listen','port','enable','tag','settings','streamSettings','sniffing','id'}"
          new="allowed={'remark','protocol','listen','port','enable','tag','settings','streamSettings','sniffing','panelMeta','id'}"
          if old in s:
              s=s.replace(old,new,1)
          needle="""        for key in ('settings','streamSettings','sniffing'):\n            v.setdefault(key,{});\n            if not isinstance(v[key],dict):raise CoreError(key+' must be an object')\n"""
          repl=needle+"""        v.setdefault('panelMeta',{})\n        if not isinstance(v['panelMeta'],dict):raise CoreError('panelMeta must be an object')\n        if len(json.dumps(v['panelMeta']))>20000:raise CoreError('panelMeta too large')\n"""
          if "panelMeta must be an object" not in s:
              assert needle in s
              s=s.replace(needle,repl,1)
          oldfp="q['sid']=next(iter(security.get('shortIds',[])),'');q['fp']=host.get('fingerprint','chrome')"
          newfp="""q['sid']=next(iter(security.get('shortIds',[])),'')\n                    meta=ib.get('panelMeta',{}).get('reality',{}) if isinstance(ib.get('panelMeta',{}),dict) else {}\n                    q['fp']=host.get('fingerprint') or meta.get('fingerprint','chrome')\n                    spider=meta.get('spiderX','')\n                    if spider:q['spx']=spider"""
          if oldfp in s:
              s=s.replace(oldfp,newfp,1)
          core.write_text(s)

          server=Path('backend/server.py')
          s=server.read_text()
          old="""        keys={'id','remark','protocol','port','listen','enable','tag','nodeId','up','down','total','expiryTime'}\n        return [{k:v for k,v in r.items() if k in keys} for r in rows if allowed is None or r['id'] in allowed]\n"""
          new="""        keys={'id','remark','protocol','port','listen','enable','tag','nodeId','up','down','total','expiryTime'}\n        out=[]\n        for r in rows:\n            if allowed is not None and r['id'] not in allowed:continue\n            item={k:v for k,v in r.items() if k in keys}\n            stream=r.get('streamSettings',{}) if isinstance(r.get('streamSettings',{}),dict) else {}\n            item['network']=stream.get('network','tcp')\n            item['security']=stream.get('security','none')\n            out.append(item)\n        return out\n"""
          if old in s:
              s=s.replace(old,new,1)
          server.write_text(s)
          PY
          python -m py_compile backend/core.py backend/server.py backend/reality_scan.py
          grep -q "panelMeta must be an object" backend/core.py
          grep -q "item\['network'\]" backend/server.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/core.py backend/server.py
          git diff --cached --quiet || git commit -m 'Wire Inbounds V3 metadata and list transport state'
          git push
