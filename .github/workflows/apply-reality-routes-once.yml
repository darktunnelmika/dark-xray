name: Apply REALITY routes once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-reality-routes-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - name: Patch server routes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/server.py')
          s=p.read_text()
          imp="from reality_scan import RealityScanError,scan_target,search_targets\n"
          if imp not in s:
              needle="from core import CoreEngine,CoreError,Config,SUB_RE\n"
              assert needle in s
              s=s.replace(needle,needle+imp,1)
          models="""\n\nclass RealityProbe(Model):\n    target:str=Field(min_length=1,max_length=300)\nclass RealitySearch(Model):\n    targets:list[str]=Field(default_factory=list,max_length=20)\n"""
          if 'class RealityProbe(Model):' not in s:
              needle="class Password(Model):\n    old_password:str=Field(min_length=1,max_length=PASSWORD_MAX_LENGTH)\n    new_password:str=Field(min_length=PASSWORD_MIN_LENGTH,max_length=PASSWORD_MAX_LENGTH)\n"
              assert needle in s
              s=s.replace(needle,needle+models,1)
          routes="""\n\n    @app.post('/api/reality/scan')\n    def reality_scan(body:RealityProbe,p:Principal=Depends(owner)):\n        try:result=scan_target(body.target)\n        except RealityScanError as ex:raise HTTPException(400,str(ex))\n        manager.audit(p.actor,p.actor.id,'reality.scan',body.target[:300])\n        return result\n\n    @app.post('/api/reality/search')\n    def reality_search(body:RealitySearch,p:Principal=Depends(owner)):\n        try:items=search_targets(body.targets or None)\n        except RealityScanError as ex:raise HTTPException(400,str(ex))\n        manager.audit(p.actor,p.actor.id,'reality.search',str(len(body.targets or [])))\n        return {'items':items,'source':'server-tls-probe','cidr_scan':False}\n"""
          if "@app.post('/api/reality/scan')" not in s:
              marker="\n    @app.post('/api/ip/unban')\n"
              assert marker in s
              s=s.replace(marker,routes+marker,1)
          p.write_text(s)
          PY
          python -m py_compile backend/server.py backend/reality_scan.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/server.py
          git diff --cached --quiet || git commit -m 'Wire REALITY target scan routes into DARK API'
          git push
