name: Stage 7.3 Rollout control and telemetry
on:
  pull_request:
    paths:
      - 'backend/core.py'
      - 'backend/server.py'
      - 'web/xray-v2.js'
      - 'tests/test_stage7_rollout_control.py'
      - 'tests/smart-routing-ui.test.cjs'
      - '.github/workflows/stage7-rollout-control.yml'
  push:
    branches: [main, work/stage7-smart-routing]
    paths:
      - 'backend/core.py'
      - 'backend/server.py'
      - 'web/xray-v2.js'
      - 'tests/test_stage7_rollout_control.py'
      - 'tests/smart-routing-ui.test.cjs'
      - '.github/workflows/stage7-rollout-control.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage7-rollout-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rollout-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      DARK_STAGE7_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Stage 7.3 control state machine
        shell: bash
        run: |
          mkdir -p qa/stage7-rollout-control
          python -m pytest -q tests/test_stage7_rollout_control.py             --junitxml=qa/stage7-rollout-control/control.xml
      - name: Stage 7.3 UI contract
        run: node tests/smart-routing-ui.test.cjs
      - name: Build exact-SHA telemetry evidence
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$DARK_STAGE7_SOURCE_SHA"
          python - <<'PY'
          import json, os, subprocess, time
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          expected=os.environ['DARK_STAGE7_SOURCE_SHA'].strip()
          if commit!=expected:
              raise SystemExit(f'candidate checkout mismatch: {commit} != {expected}')
          doc={
              'schema':1,
              'stage':'7.3',
              'name':'Rollout control and telemetry',
              'commit':expected,
              'checkoutCommit':commit,
              'passed':True,
              'productionMutation':False,
              'productionPathsTouched':[],
              'controls':['pause','resume','abort'],
              'telemetry':['health_sample','warp_probe','rollback_complete','completed'],
              'history':'bounded summary; individual timeline on demand',
              'generatedAt':time.time(),
          }
          with open('qa/stage7-rollout-control/evidence.json','w',encoding='utf-8') as f:
              json.dump(doc,f,indent=2,sort_keys=True);f.write('\n')
          PY
          printf '%s\n' "$DARK_STAGE7_SOURCE_SHA" > qa/stage7-rollout-control/source-commit.txt
          sha256sum             backend/core.py backend/server.py web/xray-v2.js             tests/test_stage7_rollout_control.py tests/smart-routing-ui.test.cjs             > qa/stage7-rollout-control/source-sha256.txt
      - name: Upload Stage 7.3 control evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dark-stage7-rollout-control
          path: |
            qa/stage7-rollout-control/
            tests/test_stage7_rollout_control.py
          if-no-files-found: error
          retention-days: 14
