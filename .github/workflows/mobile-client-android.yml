name: Mobile Client Android

on:
  workflow_dispatch:
  push:
    branches:
      - feature/dark-xray-client-bootstrap
    paths:
      - "mobile-client/**"
      - ".github/workflows/mobile-client-android.yml"

concurrency:
  group: mobile-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create temporary Android host
        run: |
          rm -rf .mobile-build
          flutter create --platforms=android --project-name=dark_xray_client --org=com.darkxray .mobile-build
          cp mobile-client/pubspec.yaml .mobile-build/pubspec.yaml
          cp mobile-client/analysis_options.yaml .mobile-build/analysis_options.yaml
          rm -rf .mobile-build/lib .mobile-build/test
          cp -R mobile-client/lib .mobile-build/lib
          cp -R mobile-client/test .mobile-build/test
          cp mobile-client/android/app/src/main/AndroidManifest.xml .mobile-build/android/app/src/main/AndroidManifest.xml
          rm -rf .mobile-build/android/app/src/main/kotlin/com/darkxray/dark_xray_client
          mkdir -p .mobile-build/android/app/src/main/kotlin/com/darkxray/dark_xray_client
          cp mobile-client/android/app/src/main/kotlin/com/darkxray/dark_xray_client/*.kt .mobile-build/android/app/src/main/kotlin/com/darkxray/dark_xray_client/

      - name: Download official XTLS libXray
        run: |
          mkdir -p .mobile-build/android/app/libs /tmp/libxray
          curl -L --fail --retry 3             -o /tmp/libxray/libxray-android.zip             https://github.com/XTLS/libXray/releases/download/v26.9.9/libxray-android.zip
          unzip -j /tmp/libxray/libxray-android.zip             'libxray-android/libXray.aar'             -d .mobile-build/android/app/libs
          test -s .mobile-build/android/app/libs/libXray.aar

      - name: Wire libXray AAR into Android app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path(".mobile-build/android/app/build.gradle.kts")
          text = p.read_text()
          if 'implementation(files("libs/libXray.aar"))' not in text:
              text += '\n\ndependencies {\n    implementation(files("libs/libXray.aar"))\n}\n'
          p.write_text(text)
          PY

      - name: Resolve dependencies
        working-directory: .mobile-build
        run: flutter pub get

      - name: Analyze
        working-directory: .mobile-build
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: .mobile-build
        run: flutter test

      - name: Build debug APK
        working-directory: .mobile-build
        run: flutter build apk --debug --target-platform android-arm64

      - name: Build release APK
        working-directory: .mobile-build
        run: flutter build apk --release --split-per-abi --target-platform android-arm64 --split-debug-info=build/symbols

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dark-xray-client-debug-apk
          path: .mobile-build/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: dark-xray-client-release-arm64-apk
          path: .mobile-build/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14
