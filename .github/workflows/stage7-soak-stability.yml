name: Stage 7.5 Soak and stability
on:
  pull_request:
    paths:
      - 'backend/core.py'
      - 'backend/server.py'
      - 'backend/nodes.py'
      - 'backend/node_agent.py'
      - 'backend/smart_routing.py'
      - 'backend/smart_warp_probe.py'
      - 'tests/stage7_real_process.py'
      - 'tests/stage7_real_multinode_acceptance.py'
      - 'tests/stage7_soak_stability.py'
      - '.github/workflows/stage7-soak-stability.yml'
  push:
    branches: [main, work/stage7-smart-routing]
    paths:
      - 'backend/core.py'
      - 'backend/server.py'
      - 'backend/nodes.py'
      - 'backend/node_agent.py'
      - 'backend/smart_routing.py'
      - 'backend/smart_warp_probe.py'
      - 'tests/stage7_real_process.py'
      - 'tests/stage7_real_multinode_acceptance.py'
      - 'tests/stage7_soak_stability.py'
      - '.github/workflows/stage7-soak-stability.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage7-soak-stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      DARK_STAGE7_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install soak dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Stage 7.5 fifty-cycle soak
        shell: bash
        run: |
          mkdir -p qa/stage7-soak
          python tests/stage7_soak_stability.py             --cycles 50             --report qa/stage7-soak/report.json
      - name: Verify exact candidate and stability gates
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$DARK_STAGE7_SOURCE_SHA"
          printf '%s\n' "$DARK_STAGE7_SOURCE_SHA" > qa/stage7-soak/source-commit.txt
          python - <<'PY'
          import json, os
          from pathlib import Path
          doc=json.loads(Path('qa/stage7-soak/report.json').read_text())
          if doc.get('passed') is not True:
              raise SystemExit('Stage 7.5 soak did not pass')
          if doc.get('cyclesRequested') != 50:
              raise SystemExit('Stage 7.5 did not execute 50 cycles')
          if doc.get('productionMutation') is not False or doc.get('productionPathsTouched') != []:
              raise SystemExit('Stage 7.5 production isolation failed')
          expected={'hub_restart':10,'pause_resume':10,'abort':10,'warp_degrade':10,'node_flap':10}
          if doc.get('typeCounts') != expected:
              raise SystemExit(f"Stage 7.5 cycle distribution mismatch: {doc.get('typeCounts')}")
          db=doc.get('database') or {}
          if not db.get('consistent') or db.get('quickCheck')!='ok' or db.get('running')!=0:
              raise SystemExit(f'Stage 7.5 DB consistency failed: {db}')
          gates=doc.get('stabilityGates') or {}
          if not gates or not all(gates.values()):
              raise SystemExit(f'Stage 7.5 stability gate failed: {gates}')
          if doc.get('rollbackEventualRecoveryRate') != 1.0:
              raise SystemExit('Stage 7.5 eventual recovery was not 100%')
          print('STAGE75_SOAK_OK',os.environ['DARK_STAGE7_SOURCE_SHA'])
          PY
          sha256sum             backend/core.py backend/server.py backend/nodes.py backend/node_agent.py             backend/smart_routing.py backend/smart_warp_probe.py             tests/stage7_real_process.py tests/stage7_real_multinode_acceptance.py             tests/stage7_soak_stability.py             > qa/stage7-soak/source-sha256.txt
      - name: Upload Stage 7.5 soak evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dark-stage7-soak-stability
          path: |
            qa/stage7-soak/
            tests/stage7_soak_stability.py
          if-no-files-found: error
          retention-days: 14
