name: Control Center V2 audited patch once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == 'darktunnelmika'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Install focused test dependencies
        run: python -m pip install -q pytest cryptography
      - name: Apply audited Control Center V2 patch
        run: |
          python tools/control_center_menu_once.py
          python tools/control_center_support_once.py
          python -m py_compile tools/menu.py tools/backup_cli.py tools/guard-control.py tools/update.py tools/provision.py tests/test_control_center_v2.py tests/test_backup_cli.py
          bash -n darkxray tests/run-tests.sh
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q tests/test_menu_owner_selection.py tests/test_control_center_v2.py tests/test_backup_cli.py tests/test_update_transaction.py
          python tools/repo-check.py
          grep -qx '0.9.0-rc3' VERSION
          grep -q "dark_xray_ip" tools/menu.py
          grep -q "backup-verify" darkxray
          grep -q "guard-control" darkxray
      - name: Publish patch and self-clean
        run: |
          git config user.name darktunnelmika
          git config user.email mikakhadmi@gmail.com
          git rm .github/workflows/control-center-v2-audit-once.yml tools/control_center_menu_once.py tools/control_center_support_once.py
          git add -A
          git commit -m 'Upgrade terminal Control Center to V2'
          git push origin HEAD:main
