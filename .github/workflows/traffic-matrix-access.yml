name: Owner WARP navigation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  owner-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependencies
        run: python -m pip install -r requirements.txt playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: WARP navigation unit tests
        run: node --test tests/traffic-matrix-access.test.cjs tests/traffic-matrix-ui.test.cjs
      - name: Real owner login and mobile navigation
        run: python tests/traffic-matrix-access-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-warp-navigation
          path: |
            qa/traffic-matrix-access.json
            qa/traffic-matrix-access.png
