name: Patch Settings V2 once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-settings-v2-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Scope legacy hydration to Settings V2 sections
        run: python tools/patch_settings_merge_scope.py
      - name: Smoke patch
        run: |
          python -m py_compile backend/core.py
          grep -q "name in {'panel','runtime','subscription','ipguard'}" backend/core.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/core.py
          git commit -m 'Scope legacy settings hydration to compatible sections'
          git push
