name: Patch Settings V2 once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-settings-v2-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Apply patch
        run: python tools/patch_settings_v2_once.py
      - name: Smoke patched files
        run: |
          python -m py_compile backend/core.py backend/server.py tools/menu.py tools/settings_apply.py
          bash -n darkxray tests/run-tests.sh
          node --check web/settings-v2.js
          grep -q "/api/runtime-config" backend/server.py
          grep -q "/assets/settings-v2.js" web/index.html
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/core.py backend/server.py darkxray tools/menu.py web/live.js web/index.html tests/run-tests.sh .github/workflows/ci.yml
          git commit -m 'Wire Settings V2 across web backend and terminal manager'
          git push
