name: Patch Clients V2 once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-clients-v2-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Apply Clients V2 backend migration
        run: python tools/run_clients_v2_patch.py
      - name: Smoke Clients V2
        run: |
          python -m py_compile backend/manager.py backend/server.py
          bash -n tests/run-tests.sh
          node --check web/clients-v2.js
          grep -q '/assets/clients-v2.js' web/index.html
          grep -q '/api/clients/bulk-create' backend/server.py
          grep -q 'client_groups' backend/manager.py
      - name: Commit application code
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/manager.py backend/server.py web/index.html tests/run-tests.sh tests/test_clients_v2.py
          git commit -m 'Build Clients V2 groups and bulk management backend'
          git push
