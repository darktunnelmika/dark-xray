name: Stage 7.2 Smart Routing failure rehearsal
on:
  pull_request:
    paths:
      - 'backend/core.py'
      - 'backend/server.py'
      - 'backend/nodes.py'
      - 'backend/node_agent.py'
      - 'backend/smart_routing.py'
      - 'backend/smart_warp_probe.py'
      - 'web/xray-v2.js'
      - 'tests/test_smart_routing*.py'
      - 'tests/test_stage7_rollout_rehearsal.py'
      - '.github/workflows/stage7-smart-routing-rehearsal.yml'
  push:
    branches: [main, work/stage7-smart-routing]
    paths:
      - 'backend/core.py'
      - 'backend/server.py'
      - 'backend/nodes.py'
      - 'backend/node_agent.py'
      - 'backend/smart_routing.py'
      - 'backend/smart_warp_probe.py'
      - 'web/xray-v2.js'
      - 'tests/test_smart_routing*.py'
      - 'tests/test_stage7_rollout_rehearsal.py'
      - '.github/workflows/stage7-smart-routing-rehearsal.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage7-smart-routing-rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  failure-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      DARK_STAGE7_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Stage 7.2 backend failure injection
        id: rehearsal
        shell: bash
        run: |
          mkdir -p qa/stage7-smart-routing
          set +e
          python -m pytest -q tests/test_stage7_rollout_rehearsal.py             --junitxml=qa/stage7-smart-routing/rehearsal.xml
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          export DARK_STAGE7_REHEARSAL_RC="$rc"
          python - <<'PY'
          import json, os, subprocess, time
          checkout=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          expected=os.environ['DARK_STAGE7_SOURCE_SHA'].strip()
          if checkout!=expected:
              raise SystemExit(f'candidate checkout mismatch: {checkout} != {expected}')
          rc=int(os.environ['DARK_STAGE7_REHEARSAL_RC'])
          evidence={
              'schema':1,
              'stage':'7.2',
              'name':'Smart Routing failure rehearsal',
              'commit':expected,
              'checkoutCommit':checkout,
              'passed':rc==0,
              'productionMutation':False,
              'productionPathsTouched':[],
              'scenarios':[
                  'canary_disconnect_inside_observation_auto_rollback',
                  'post_apply_warp_degradation_auto_rollback',
                  'all_nodes_before_hub_last',
                  'persisted_mid_rollout_auto_resume_after_hub_restart',
              ],
              'generatedAt':time.time(),
          }
          with open('qa/stage7-smart-routing/rehearsal.json','w',encoding='utf-8') as f:
              json.dump(evidence,f,indent=2,sort_keys=True)
              f.write('\n')
          PY
          exit "$rc"
      - name: Stage 7.2 UI contract
        if: always()
        run: node tests/smart-routing-ui.test.cjs
      - name: Preserve bounded source evidence
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "$DARK_STAGE7_SOURCE_SHA"
          printf '%s\n' "$DARK_STAGE7_SOURCE_SHA" > qa/stage7-smart-routing/source-commit.txt
          sha256sum             backend/core.py backend/server.py backend/nodes.py backend/node_agent.py             backend/smart_routing.py backend/smart_warp_probe.py web/xray-v2.js             tests/test_smart_routing_review.py tests/test_stage7_rollout_rehearsal.py             tests/smart-routing-ui.test.cjs             > qa/stage7-smart-routing/source-sha256.txt
      - name: Upload Stage 7.2 rehearsal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dark-stage7-smart-routing-rehearsal
          path: |
            qa/stage7-smart-routing/
            tests/test_stage7_rollout_rehearsal.py
          if-no-files-found: error
          retention-days: 14
