name: Cleanup Stage 7 Temporary Workflows

on:
  push:
    branches:
      - work/stage7-smart-routing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[stage7-cleanup-done]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/stage7-smart-routing
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify Stage 7 tests
        run: |
          python3 -m pip install -q --upgrade pip
          python3 -m pip install -q -r requirements.txt -r requirements-dev.txt httpx httpx2 uvicorn
          PYTHONPATH=backend pytest -q tests/test_smart_routing.py tests/test_web_contract.py tests/test_v06.py
          python3 tools/repo-check.py

      - name: Remove temporary Stage 7 workflows
        run: |
          rm -f .github/workflows/stage7-smart-routing-patch.yml
          rm -f .github/workflows/stage7-smart-routing-sync.yml
          rm -f .github/workflows/stage7-sync-smart-routing.yml
          git add -A .github/workflows
          git commit -m 'Remove Stage 7 temporary sync workflows' || true

      - name: Refresh SHA256SUMS after cleanup
        run: |
          python3 tools/release_snapshot.py --refresh-source-sums --json-only
          git add SHA256SUMS
          git commit -m 'Refresh checksums after Stage 7 workflow cleanup [stage7-cleanup-done]' || true

      - name: Rebase and push cleanup
        run: |
          git pull --rebase origin work/stage7-smart-routing
          git push origin HEAD:work/stage7-smart-routing
