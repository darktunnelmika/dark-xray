name: Node real transport matrix
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: node-real-transports-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-transports:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      DARK_REAL_XRAY_BINARY: ${{ github.workspace }}/.test-core/xray
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify independent URI consumer guards
        run: python -m pytest tests/test_node_transport_helpers.py -q --junitxml=qa/junit/node-transport-helpers.xml
      - name: Fetch verified pinned official core
        run: python tools/fetch-core.py --version v26.3.27 --destination "$GITHUB_WORKSPACE/.test-core"
      - name: Two-node generated links TLS REALITY and transport matrix
        run: python -m pytest tests/test_node_real_transports.py -q --junitxml=qa/junit/node-real-transports.xml
      - name: Preserve candidate and source identity
        if: always()
        run: |
          mkdir -p qa/node-real-transports
          git rev-parse HEAD > qa/node-real-transports/source-commit.txt
          sha256sum tests/test_node_real_transports.py tests/test_node_transport_helpers.py .github/workflows/node-real-transports.yml docs/node-real-transports.md tests/test_node_real_data_plane.py tests/test_node_wan_https.py > qa/node-real-transports/source-sha256.txt
          if test -f .test-core/DARK-CORE-PROVENANCE.json; then
            cp .test-core/DARK-CORE-PROVENANCE.json qa/node-real-transports/core-provenance.json
          fi
      - name: Upload bounded evidence without temporary credentials
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dark-node-real-transports
          path: |
            qa/junit/node-transport-helpers.xml
            qa/junit/node-real-transports.xml
            qa/node-real-transports/
            tests/test_node_real_transports.py
            tests/test_node_transport_helpers.py
            docs/node-real-transports.md
          if-no-files-found: error
          retention-days: 14
