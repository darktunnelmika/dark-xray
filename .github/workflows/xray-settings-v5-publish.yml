name: Publish verified Xray Settings V5 candidate
on:
  push:
    branches: [automation/xray-settings-v5-publisher-20261001]
    paths: [.github/workflows/xray-settings-v5-publish.yml]
permissions:
  contents: write
concurrency:
  group: xray-settings-v5-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconstruct and verify exact audited source
        shell: bash
        run: |
          set -euo pipefail
          cp qa/xray-settings-v5.capsule.b64 /tmp/xray-settings-v5.capsule.b64
          git checkout --detach 1f6028cbbe282bf818f15530f87ef5295ed7b8f3
          python - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path
          expected = 'df70dad28d4cca402b11d4b2757d2cefb783a6b0bd47cd3f8073ac7b401904b0'
          raw = lzma.decompress(base64.b64decode(Path('/tmp/xray-settings-v5.capsule.b64').read_text(), validate=True))
          assert hashlib.sha256(raw).hexdigest() == expected, 'source capsule checksum mismatch'
          doc = json.loads(raw)
          base = '1f6028cbbe282bf818f15530f87ef5295ed7b8f3'
          assert doc['base'] == base == subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          allowed = {'VERSION','backend/server.py','backend/warp_paths.py','docs/XRAY-SETTINGS-V5.md',
                     'tests/browser-smoke.py','tests/run-tests.sh','tests/test_xray_settings_v5.py',
                     'tests/xray-settings-v5-browser.py','tests/xray-settings-v5.test.cjs',
                     'web/index.html','web/traffic-engine-v4.js','web/traffic-matrix.js',
                     'web/xray-settings-v5.css','web/xray-settings-v5.js'}
          assert len(doc['files']) == len(allowed)
          assert {item['path'] for item in doc['files']} == allowed
          for item in doc['files']:
              path = Path(item['path'])
              assert not path.is_symlink()
              if item['before'] is None:
                  assert not path.exists(), 'new file already exists'
                  old = ''
              else:
                  old_bytes = path.read_bytes()
                  assert hashlib.sha256(old_bytes).hexdigest() == item['before'], str(path)
                  old = old_bytes.decode('utf-8')
              text = old
              end = len(old)
              for start, stop, replacement in reversed(item['edits']):
                  assert isinstance(start, int) and isinstance(stop, int) and 0 <= start <= stop <= end
                  assert isinstance(replacement, str)
                  text = text[:start] + replacement + text[stop:]
                  end = start
              assert hashlib.sha256(text.encode()).hexdigest() == item['after'], str(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding='utf-8')
          subprocess.run(['git','add','--',*sorted(allowed)], check=True)
          changed = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          assert changed == allowed
          names = sorted(p for p in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if p and p != 'SHA256SUMS')
          Path('SHA256SUMS').write_text(''.join(hashlib.sha256(Path(p).read_bytes()).hexdigest()+'  '+p+'\n' for p in names))
          subprocess.run(['git','add','SHA256SUMS'], check=True)
          print('Verified exact source capsule:', expected)
          print('Runtime scope: Hub settings/API/UI only; Node/Tunnel implementations unchanged.')
          PY
          git diff --cached --check
          sha256sum -c SHA256SUMS >/tmp/xray-v5-checksums.log
          diff -u <(git ls-files | grep -vx 'SHA256SUMS' | LC_ALL=C sort) <(cut -c67- SHA256SUMS | LC_ALL=C sort)
          python tools/repo-check.py
      - name: Run targeted regressions before publishing
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pip install -q -r requirements-dev.txt
          python -m pytest -q tests/test_traffic_matrix_api.py tests/test_warp_probe_limits.py tests/test_xray_settings_v5.py
          node --test tests/traffic-matrix-ui.test.cjs tests/traffic-matrix-access.test.cjs tests/traffic-engine-v4.test.cjs tests/xray-settings-v5.test.cjs
      - name: Publish candidate branch without merging or deploying
        shell: bash
        run: |
          set -euo pipefail
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(xray): server-first manual WARP and scoped settings closeout (rc30)'
          git push origin HEAD:refs/heads/fix/xray-settings-v5-manual-warp
          printf 'Published candidate commit: '
          git rev-parse HEAD
          echo 'PR creation, full CI verification, merge and production rollout remain separate gates.'
