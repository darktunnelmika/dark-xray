name: Stabilize DARK owner accounts once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply patch
        run: python tools/stabilize_owner_accounts_once.py
      - name: Syntax smoke
        run: |
          python -m py_compile backend/auth.py backend/server.py
          node --check web/live.js
          python tools/repo-check.py
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run isolated suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: bash tests/run-tests.sh
      - name: Publish application changes
        run: |
          git config user.name darktunnelmika
          git config user.email mikakhadmi@gmail.com
          git add backend web tests
          git commit -m 'Keep owner login and profile creation consistent'
          git push origin HEAD:main
