name: Stabilize DARK update contract once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  stabilize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply stabilization
        run: python tools/stabilize_update_contract_once.py
      - name: Static smoke
        run: |
          python -m py_compile tools/update.py tools/stabilize_update_contract_once.py tests/test_update_transaction.py tests/test_web_contract.py
          bash -n install-online.sh tests/run-tests.sh darkxray
          bash install-online.sh --selftest >/tmp/dark-installer-selftest.txt
          grep -q 'Installer runtime self-test passed' /tmp/dark-installer-selftest.txt
          python tools/repo-check.py
      - name: Install tests
        run: python -m pip install -r requirements-dev.txt
      - name: Full isolated suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: bash tests/run-tests.sh
      - name: Publish application changes
        run: |
          git config user.name darktunnelmika
          git config user.email mikakhadmi@gmail.com
          git add tools/update.py install-online.sh tests VERSION
          git commit -m 'Harden update rollback and web route contract'
          git push origin HEAD:main
