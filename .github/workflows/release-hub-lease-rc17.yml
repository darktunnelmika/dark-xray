name: Materialize verified Hub lease candidate
on:
  push:
    branches: [fix/hub-lease-accounting-rc17]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == 'darktunnelmika/dark-xray' && github.ref == 'refs/heads/fix/hub-lease-accounting-rc17'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/hub-lease-accounting-rc17
      - name: Fetch immutable public-source candidate and verify complete tree
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --max-time 40 --retry 2 'https://steven.darkvpn.info:2087/assets/release-source-075ec4ce5880559d.patch.gz' -o /tmp/dark-candidate.patch.gz
          echo '075ec4ce5880559d2ee1627bbb1004f8f6948c63be8cd4d5ba5e106623da2121  /tmp/dark-candidate.patch.gz' | sha256sum --check --strict
          gzip -dc /tmp/dark-candidate.patch.gz > /tmp/dark-candidate.patch
          echo 'f6f9a148b4fee63c0d1c111802a997325c678ff4327531b0309142cebf70b284  /tmp/dark-candidate.patch' | sha256sum --check --strict
          git rm .github/workflows/release-hub-lease-rc17.yml
          git apply --index /tmp/dark-candidate.patch
          git diff --cached --check
          test "$(git write-tree)" = '4b3df9a93bc48885f1b72a2ad844f6a73591326f'
          python -m py_compile backend/core.py backend/node_runtime.py backend/node_agent.py backend/nodes.py backend/node_lease_sync.py backend/server.py backend/restore_groups.py tests/test_hub_lease.py tests/test_hub_lease_real.py
          git -c user.name='darktunnelmika' -c user.email='321545960+darktunnelmika@users.noreply.github.com' commit -m 'fix: checkpoint Node traffic and enforce accounting-backed Hub leases (rc17)'
          git push origin HEAD:refs/heads/fix/hub-lease-accounting-rc17
          echo "Verified candidate $(git rev-parse HEAD) tree $(git rev-parse HEAD^{tree})"
