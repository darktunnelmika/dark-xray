name: Stage 7 Smart Routing Sync

on:
  push:
    branches:
      - work/stage7-smart-routing

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Stage 7
        uses: actions/checkout@v4
        with:
          ref: work/stage7-smart-routing
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -q -r requirements-dev.txt

      - name: Patch Stage 7 API
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('backend/server.py')
          s=p.read_text()

          old="from update_bridge import UpdateBrokerClient,UpdateBrokerError\n"
          new=old+"from smart_routing import SmartRoutingError,build_stage7_patch,build_stage7_plan,rank_warp_paths\n"
          if "from smart_routing import SmartRoutingError" not in s:
              if old not in s: raise SystemExit('import anchor missing')
              s=s.replace(old,new,1)

          old="""    attrs:dict[str,str]=Field(default_factory=dict,max_length=64)
class FullBackupBody(Model):
"""
          new="""    attrs:dict[str,str]=Field(default_factory=dict,max_length=64)
class SmartRoutingPreview(Model):
    warpAi:bool=True
    adblock:bool=True
    warpOutboundTags:list[str]=Field(default_factory=list,max_length=32)
class SmartWarpRank(Model):
    observations:list[dict[str,Any]]=Field(default_factory=list,max_length=256)

class FullBackupBody(Model):
"""
          if "class SmartRoutingPreview(Model):" not in s:
              if old not in s: raise SystemExit('model anchor missing')
              s=s.replace(old,new,1)

          old="""    @app.post('/api/traffic-engine/preview')
    def traffic_engine_preview(body:TrafficRoutePreview,p:Principal=Depends(owner)):return traffic_preview(body)

    @app.get('/api/security-center')
"""
          new="""    @app.post('/api/traffic-engine/preview')
    def traffic_engine_preview(body:TrafficRoutePreview,p:Principal=Depends(owner)):return traffic_preview(body)

    @app.get('/api/smart-routing/plan')
    def smart_routing_plan(p:Principal=Depends(owner)):
        return build_stage7_plan(nodes.list(),engine.section('outbounds'),engine.section('routing'))

    @app.post('/api/smart-routing/preview')
    def smart_routing_preview(body:SmartRoutingPreview,p:Principal=Depends(owner)):
        try:
            return build_stage7_patch(engine.section('outbounds'),engine.section('routing'),
                                      warp_outbound_tags=body.warpOutboundTags,
                                      enable_warp_ai=body.warpAi,enable_adblock=body.adblock)
        except SmartRoutingError as ex:
            raise HTTPException(400,str(ex))

    @app.post('/api/smart-routing/warp-rank')
    def smart_routing_warp_rank(body:SmartWarpRank,p:Principal=Depends(owner)):
        return {'items':rank_warp_paths(body.observations),'previewOnly':True}

    @app.get('/api/security-center')
"""
          if "/api/smart-routing/plan" not in s:
              if old not in s: raise SystemExit('route anchor missing')
              s=s.replace(old,new,1)

          p.write_text(s)
          PY

      - name: Validate Stage 7
        run: |
          python -m py_compile backend/server.py backend/smart_routing.py
          PYTHONPATH=backend pytest -q tests/test_smart_routing.py tests/test_v06.py tests/test_web_contract.py
          python tools/repo-check.py

      - name: Commit API patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- backend/server.py; then
            git add backend/server.py
            git commit -m "Expose Stage 7 smart routing preview API"
          fi

      - name: Refresh source checksums
        run: |
          python tools/release_snapshot.py --refresh-source-sums --json-only
          if ! git diff --quiet -- SHA256SUMS; then
            git add SHA256SUMS
            git commit -m "Refresh checksums for Stage 7 smart routing API"
          fi

      - name: Push Stage 7 branch
        run: git push origin HEAD:work/stage7-smart-routing
