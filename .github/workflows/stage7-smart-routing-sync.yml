name: Stage 7 Smart Routing Sync

on:
  push:
    branches:
      - work/stage7-smart-routing
    paths:
      - '.github/workflows/stage7-smart-routing-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Stage 7 branch
        uses: actions/checkout@v4
        with:
          ref: work/stage7-smart-routing
          fetch-depth: 0

      - name: Patch server API endpoints
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/server.py')
          text=p.read_text()
          imp='from update_bridge import UpdateBrokerClient,UpdateBrokerError\n'
          add='from smart_routing import SmartRoutingError, build_stage7_patch, build_stage7_plan, rank_warp_paths\n'
          if add not in text:
              text=text.replace(imp,imp+add)
          marker="class FullBackupBody(Model):\n"
          models="""
class SmartRoutingPreview(Model):
    warpAi:bool=True
    adblock:bool=True
    warpOutboundTags:list[str]=Field(default_factory=list,max_length=32)

class SmartWarpRank(Model):
    observations:list[dict[str,Any]]=Field(default_factory=list,max_length=128)

"""
          if 'class SmartRoutingPreview(Model):' not in text:
              text=text.replace(marker,models+marker)
          traffic_marker='    def traffic_engine_doc():\n'
          endpoints="""
    def smart_routing_plan_payload():
        return build_stage7_plan(nodes.list(), engine.section('outbounds'), engine.section('routing'))

    @app.get('/api/smart-routing/plan')
    def smart_routing_plan(p:Principal=Depends(owner)):
        return smart_routing_plan_payload()

    @app.post('/api/smart-routing/preview')
    def smart_routing_preview(body:SmartRoutingPreview,p:Principal=Depends(owner)):
        try:
            return build_stage7_patch(engine.section('outbounds'), engine.section('routing'),
                                      warp_outbound_tags=body.warpOutboundTags,
                                      enable_warp_ai=body.warpAi, enable_adblock=body.adblock)
        except SmartRoutingError as ex:
            raise HTTPException(400,str(ex))

    @app.post('/api/smart-routing/warp-rank')
    def smart_routing_warp_rank(body:SmartWarpRank,p:Principal=Depends(owner)):
        return {'items':rank_warp_paths(body.observations),'previewOnly':True}

"""
          if "/api/smart-routing/plan" not in text:
              text=text.replace(traffic_marker,endpoints+traffic_marker)
          p.write_text(text)
          PY

      - name: Install test dependencies
        run: |
          python3 -m pip install --user -q --disable-pip-version-check pytest fastapi httpx httpx2 uvicorn pydantic psutil

      - name: Run Stage 7 tests
        run: |
          PYTHONPATH=backend python3 -m pytest -q tests/test_smart_routing.py tests/test_v06.py tests/test_web_contract.py
          python3 tools/repo-check.py

      - name: Refresh SHA256SUMS
        run: |
          python3 tools/release_snapshot.py --refresh-source-sums --json-only

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add backend/server.py SHA256SUMS
            git commit -m "Wire Stage 7 smart routing preview API"
            git push origin HEAD:work/stage7-smart-routing
          fi
