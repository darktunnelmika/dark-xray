name: Stage 6 Node Guard packet enforcement
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage6-node-guard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node-guard-packet:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      DARK_REAL_XRAY_BINARY: ${{ github.workspace }}/.test-core/xray
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -q nftables iproute2
          python -m pip install -r requirements-dev.txt
      - name: Stage 6 convergence regressions
        run: |
          python -m pytest -q             tests/test_nodes_v2.py::test_global_block_refreshes_all_node_desired_states_and_reports_offline_convergence             tests/test_nodes_v2.py::test_hub_observe_node_enforce_is_translated_only_for_agent_payload             tests/test_settings_v2.py::test_ipguard_legacy_mode_hydrates_node_mode_and_independent_node_enforce_is_allowed             tests/test_node_control_lifecycle.py::test_agent_health_exposes_guard_state_without_claiming_enforcement             tests/test_security_center_v4.py
      - name: Fetch verified official Xray
        run: |
          python tools/fetch-core.py --version v26.3.27 --destination "$GITHUB_WORKSPACE/.test-core"
          install -d -m 0755 /tmp/dark-stage6-core
          install -m 0755 "$DARK_REAL_XRAY_BINARY" /tmp/dark-stage6-core/xray
          install -m 0644 "$GITHUB_WORKSPACE/.test-core/DARK-CORE-PROVENANCE.json" /tmp/dark-stage6-core/DARK-CORE-PROVENANCE.json
          echo "DARK_REAL_XRAY_BINARY=/tmp/dark-stage6-core/xray" >> "$GITHUB_ENV"
      - name: Real Node Guard packet path in isolated namespaces
        run: |
          export DARK_SECURITY_PARENT_NETNS="$(readlink /proc/self/ns/net)"
          export DARK_GUARD_PARENT_MNTNS="$(readlink /proc/self/ns/mnt)"
          sudo --preserve-env=DARK_REAL_XRAY_BINARY,DARK_SECURITY_PARENT_NETNS,DARK_GUARD_PARENT_MNTNS,PYTEST_DISABLE_PLUGIN_AUTOLOAD             unshare --net --mount -- "$(command -v python)" tests/node_guard_packet_lab.py
      - name: Preserve bounded Stage 6 evidence
        if: always()
        run: |
          mkdir -p qa/stage6-node-guard
          git rev-parse HEAD > qa/stage6-node-guard/source-commit.txt
          sha256sum backend/core.py backend/node_runtime.py backend/node_agent.py backend/nodes.py backend/server.py             backend/guard_bridge.py backend/guardd.py tests/test_node_real_guard_enforcement.py             tests/node_guard_packet_lab.py web/ipguard-v4.js > qa/stage6-node-guard/source-sha256.txt
          test ! -f .test-core/DARK-CORE-PROVENANCE.json || cp .test-core/DARK-CORE-PROVENANCE.json qa/stage6-node-guard/core-provenance.json
      - name: Upload Stage 6 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dark-stage6-node-guard
          path: |
            qa/junit/node-real-guard-enforcement.xml
            qa/stage6-node-guard/
            tests/test_node_real_guard_enforcement.py
            tests/node_guard_packet_lab.py
          if-no-files-found: error
          retention-days: 14
