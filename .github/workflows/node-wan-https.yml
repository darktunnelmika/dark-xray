name: Node multi-node HTTPS acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: node-wan-https-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-https:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Timing contracts and two real TLS Agent listeners
        run: >-
          python -m pytest tests/test_target_node_budget.py tests/test_node_wan_https.py
          tests/test_node_wan_readiness.py tests/test_node_wan_gate.py tests/test_target_vps_gate.py
          -q --junitxml=qa/junit/node-wan-https-acceptance.xml
      - name: Upload exact-commit HTTPS evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dark-node-wan-https-acceptance
          path: qa/junit/node-wan-https-acceptance.xml
          if-no-files-found: error
          retention-days: 14
