name: Stage 7.4 Real multi-Node acceptance
on:
  pull_request:
    paths:
      - 'backend/nodes.py'
      - 'backend/server.py'
      - 'backend/node_agent.py'
      - 'backend/smart_routing.py'
      - 'backend/smart_warp_probe.py'
      - 'tests/stage7_real_process.py'
      - 'tests/stage7_real_multinode_acceptance.py'
      - 'tests/test_nodes_v2.py'
      - '.github/workflows/stage7-real-multinode.yml'
  push:
    branches: [main, work/stage7-smart-routing]
    paths:
      - 'backend/nodes.py'
      - 'backend/server.py'
      - 'backend/node_agent.py'
      - 'backend/smart_routing.py'
      - 'backend/smart_warp_probe.py'
      - 'tests/stage7_real_process.py'
      - 'tests/stage7_real_multinode_acceptance.py'
      - 'tests/test_nodes_v2.py'
      - '.github/workflows/stage7-real-multinode.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage7-real-multinode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-multinode:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      DARK_STAGE7_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install acceptance dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Smart WARP transport timeout regression
        run: >-
          python -m pytest -q
          tests/test_nodes_v2.py::test_smart_warp_probe_chunks_multi_path_requests_under_transport_timeout
      - name: Real Hub plus four real TLS Node Agent processes
        shell: bash
        run: |
          mkdir -p qa/stage7-real-multinode
          python tests/stage7_real_multinode_acceptance.py             --report qa/stage7-real-multinode/acceptance.json
      - name: Verify exact candidate and acceptance evidence
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$DARK_STAGE7_SOURCE_SHA"
          printf '%s\n' "$DARK_STAGE7_SOURCE_SHA" > qa/stage7-real-multinode/source-commit.txt
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('qa/stage7-real-multinode/acceptance.json')
          if not p.is_file():
              raise SystemExit('Stage 7.4 acceptance evidence missing')
          doc=json.loads(p.read_text())
          if doc.get('passed') is not True:
              raise SystemExit('Stage 7.4 acceptance did not pass')
          if doc.get('productionMutation') is not False or doc.get('productionPathsTouched') != []:
              raise SystemExit('Stage 7.4 production isolation claim failed')
          if doc.get('separateProcesses') is not True or doc.get('tlsVerified') is not True:
              raise SystemExit('Stage 7.4 process/TLS proof missing')
          names={x.get('name') for x in doc.get('scenarios',[])}
          required={'pause_hub_restart_resume','post_apply_warp_degradation',
                    'owner_abort_during_observation','real_canary_process_outage_and_recovery'}
          if names != required:
              raise SystemExit(f'Stage 7.4 scenario mismatch: {names}')
          print('STAGE74_EVIDENCE_OK',os.environ['DARK_STAGE7_SOURCE_SHA'])
          PY
          sha256sum             backend/nodes.py backend/server.py backend/node_agent.py             backend/smart_routing.py backend/smart_warp_probe.py             tests/stage7_real_process.py tests/stage7_real_multinode_acceptance.py             tests/test_nodes_v2.py             > qa/stage7-real-multinode/source-sha256.txt
      - name: Upload Stage 7.4 acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dark-stage7-real-multinode-acceptance
          path: |
            qa/stage7-real-multinode/
            tests/stage7_real_process.py
            tests/stage7_real_multinode_acceptance.py
          if-no-files-found: error
          retention-days: 14
