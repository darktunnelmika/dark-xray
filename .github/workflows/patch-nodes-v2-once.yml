name: Patch Nodes V2 once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-nodes-v2-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Apply Nodes V2 backend migration
        run: python tools/patch_nodes_v2_once.py
      - name: Smoke Nodes V2
        run: |
          python -m py_compile backend/server.py backend/nodes.py
          node --check web/nodes-v2.js
          bash -n tests/run-tests.sh
          grep -q '/node/api/health' backend/server.py
          grep -q '/api/nodes' backend/server.py
          grep -q '/assets/nodes-v2.js' web/index.html
      - name: Commit application code
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/server.py web/index.html tests/run-tests.sh tests/test_nodes_v2.py
          git commit -m 'Build secure Nodes V2 registry and DARK agent API'
          git push
