name: Node real Xray data plane
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: node-real-data-plane-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-node-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      DARK_REAL_XRAY_BINARY: ${{ github.workspace }}/.test-core/xray
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Fetch and verify pinned official Xray
        run: python tools/fetch-core.py --version v26.3.27 --destination "$GITHUB_WORKSPACE/.test-core"
      - name: Real two-node SOCKS VLESS HTTP and accounting acceptance
        run: python -m pytest tests/test_node_real_data_plane.py -q --junitxml=qa/junit/node-real-data-plane.xml
      - name: Preserve exact source and report boundaries
        if: always()
        run: |
          mkdir -p qa/node-real-data-plane
          git rev-parse HEAD > qa/node-real-data-plane/source-commit.txt
          sha256sum tests/test_node_real_data_plane.py .github/workflows/node-real-data-plane.yml docs/node-real-data-plane.md > qa/node-real-data-plane/source-sha256.txt
          if test -f .test-core/DARK-CORE-PROVENANCE.json; then
            cp .test-core/DARK-CORE-PROVENANCE.json qa/node-real-data-plane/core-provenance.json
          fi
      - name: Upload isolated data-plane evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dark-node-real-data-plane
          path: |
            qa/junit/node-real-data-plane.xml
            qa/node-real-data-plane/
            tests/test_node_real_data_plane.py
            docs/node-real-data-plane.md
          if-no-files-found: error
          retention-days: 14
