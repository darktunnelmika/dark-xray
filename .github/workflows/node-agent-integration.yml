name: Node Agent recovery integration
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'tools/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/node-agent-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: node-agent-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Focused API and recovery tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest tests/test_node_hub_recovery.py -q --junitxml=qa/node-agent-integration.xml
      - name: Capture reproducible source identity
        if: always()
        run: |
          mkdir -p qa
          git rev-parse HEAD > qa/node-agent-source-commit.txt
      - name: Upload isolated recovery evidence and public source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dark-node-agent-recovery-source
          path: |
            qa/node-agent-integration.xml
            qa/node-agent-source-commit.txt
            backend/
            tools/
            tests/
            deploy/
            requirements*.txt
            VERSION
            LICENSE
            THIRD-PARTY-NOTICES.md
          if-no-files-found: error
          retention-days: 7
