name: Node real IP and declared HWID limits
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: node-real-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-node-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      DARK_REAL_XRAY_BINARY: ${{ github.workspace }}/.test-core/xray
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify namespace bootstrap guards
        run: python -m pytest tests/test_node_security_lab.py -q --junitxml=qa/junit/node-security-lab.xml
      - name: Fetch and verify pinned official Xray
        run: python tools/fetch-core.py --version v26.3.27 --destination "$GITHUB_WORKSPACE/.test-core"
      - name: Real IP sources and declared HWID in network-isolated lab
        run: |
          export DARK_SECURITY_PARENT_NETNS="$(readlink /proc/self/ns/net)"
          sudo --preserve-env=DARK_REAL_XRAY_BINARY,DARK_SECURITY_PARENT_NETNS,PYTEST_DISABLE_PLUGIN_AUTOLOAD \
            unshare --net -- "$(command -v python)" tests/node_security_lab.py
      - name: Preserve source identity and core provenance
        if: always()
        run: |
          mkdir -p qa/node-real-security
          git rev-parse HEAD > qa/node-real-security/source-commit.txt
          sha256sum tests/test_node_real_security.py tests/node_security_lab.py tests/test_node_security_lab.py tests/test_node_real_data_plane.py tests/test_node_real_limits.py .github/workflows/node-real-security.yml docs/node-real-security.md > qa/node-real-security/source-sha256.txt
          if test -f .test-core/DARK-CORE-PROVENANCE.json; then
            cp .test-core/DARK-CORE-PROVENANCE.json qa/node-real-security/core-provenance.json
          fi
      - name: Upload bounded results without private fixtures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dark-node-real-security
          path: |
            qa/junit/node-real-security.xml
            qa/junit/node-security-lab.xml
            qa/node-real-security/
            qa/node-real-data-plane/
            tests/test_node_real_security.py
            tests/node_security_lab.py
            docs/node-real-security.md
          if-no-files-found: error
          retention-days: 14
