name: Finalize DARK XRAY v0.7 Lab once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v07-once.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Finalize v0.7 lab source
        run: python tools/finalize_v07_once.py
      - name: Smoke final source
        run: |
          python -m py_compile backend/server.py backend/nodes.py tools/update.py
          bash -n install-online.sh tests/run-tests.sh
          node --check web/clients-v2.js
          node --check web/xray-v2.js
          node --check web/hosts-v2.js
          node --check web/ops-v2.js
          node --check web/nodes-v2.js
          test ! -e web/inbounds-v2.js
          test ! -e web/inbounds-v2.css
          grep -q '0.7.0-standalone-lab' VERSION
          grep -q 'format=singbox' tests/test_standalone.py
      - name: Commit final application cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset .github/workflows/finalize-v07-once.yml tools/finalize_v07_once.py
          git commit -m 'Finalize DARK XRAY v0.7 standalone lab workspace'
          git push
