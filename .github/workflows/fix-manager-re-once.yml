name: Fix Clients V2 import once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-manager-re-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - run: python tools/fix_manager_re_once.py
      - run: python -m py_compile backend/manager.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/manager.py
          git commit -m 'Fix Clients V2 group color validator import'
          git push
